  <script>
    initSupabase();
    let session;
    let currentTab = 'student';
    let talentItems = [];
    let qrCodesMap = {};
    let currentItemId = null;
    let currentQRId = null;
    let locCoords = { lat: null, lng: null };

    (async () => {
      session = await initPage(90, '../login.html');
      if (!session) return;
      applyPermNav(session.permissionRank || 0);
      renderRoleBadge('navUser', session, '../');
      autoLogPageView();
      updatePendingBadge();
      updateNavOrderBadge();
      await loadData();
    })();

    async function loadData() {
      const [itemRes, qrRes] = await Promise.all([
        fetchAllTalentItems(),
        _sb.from('talent_qr_codes').select('*').eq('is_active', true)
      ]);
      talentItems = itemRes.data || [];
      qrCodesMap = {};
      (qrRes.data || []).forEach(q => { qrCodesMap[q.talent_item_id] = q; });
      renderItems();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabStudent').classList.toggle('active', tab === 'student');
      document.getElementById('tabTeacher').classList.toggle('active', tab === 'teacher');
      renderItems();
    }

    function renderItems() {
      const items = talentItems.filter(i => i.target_type === currentTab);
      const container = document.getElementById('itemList');

      if (items.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:var(--admin-text-muted);padding:2rem;">?깅줉????ぉ?????????</div>';
        return;
      }

      container.innerHTML = items.map(item => {
        const qr = qrCodesMap[item.id];
        const hasQR = !!qr;
        const statusText = hasQR ? '??QR ???? : '??QR ????';
        return `<div class="qr-item-card">
          <div class="qr-item-info">
            <div class="qr-item-name">${item.name}</div>
            <div class="qr-item-amount">+${item.talent_amount} ?щ???/div>
            <div class="qr-item-status">${statusText}${hasQR && qr.valid_until ? ' 쨌 留?猷?: ' + formatDT(qr.valid_until) : ''}${hasQR && qr.location_address ? ' 쨌 ???' + qr.location_address : ''}</div>
          </div>
          <div class="qr-item-actions">
            <button class="filter-btn" style="background:var(--admin-primary);color:#fff;" onclick="openQRCreateModal('${item.id}','${item.name.replace(/'/g,"\\'")}')">??? QR ${hasQR ? '?ъ??? : '?앹??}</button>
            ${hasQR ? `<button class="filter-btn" onclick="viewQR('${item.id}','${item.name.replace(/'/g,"\\'")}')">???QR 蹂닿린</button>` : ''}
            <button class="filter-btn" onclick="openScanLog('${item.id}','${item.name.replace(/'/g,"\\'")}')">??? ?대젰</button>
          </div>
        </div>`;
      }).join('');
    }

    function openQRCreateModal(itemId, itemName) {
      currentItemId = itemId;
      document.getElementById('qrCreateTitle').textContent = `${itemName} - QR 肄??? ?앹??;
      document.getElementById('chkAlways').checked = true;
      document.getElementById('chkNoLocation').checked = true;
      toggleValidity();
      toggleLocation();
      locCoords = { lat: null, lng: null };
      document.getElementById('locLat').textContent = '-';
      document.getElementById('locLng').textContent = '-';
      document.getElementById('locSearchResult').textContent = '';
      document.getElementById('locAddress').value = '';
      document.getElementById('qrCreateError').classList.remove('show');
      document.getElementById('qrCreateModal').classList.remove('hidden');
    }

    function closeQRCreateModal() { document.getElementById('qrCreateModal').classList.add('hidden'); }

    function toggleValidity() {
      document.getElementById('validityFields').style.display = document.getElementById('chkAlways').checked ? 'none' : '';
    }

    function toggleLocation() {
      document.getElementById('locationFields').style.display = document.getElementById('chkNoLocation').checked ? 'none' : '';
    }

    async function searchAddress() {
      const addr = document.getElementById('locAddress').value.trim();
      const resultEl = document.getElementById('locSearchResult');
      if (!addr) { resultEl.textContent = '二쇱??瑜?????????'; return; }

      if (typeof kakao === 'undefined' || !kakao.maps || !kakao.maps.services) {
        resultEl.innerHTML = '<span style="color:#e03131;">Kakao Maps API媛? 濡?????? ?????듬???? API ?ㅻ? ????????</span>';
        return;
      }

      resultEl.textContent = '寃???以?..';
      const geocoder = new kakao.maps.services.Geocoder();
      geocoder.addressSearch(addr, (result, status) => {
        if (status === kakao.maps.services.Status.OK && result.length > 0) {
          const r = result[0];
          locCoords.lat = parseFloat(r.y);
          locCoords.lng = parseFloat(r.x);
          document.getElementById('locLat').textContent = locCoords.lat.toFixed(6);
          document.getElementById('locLng').textContent = locCoords.lng.toFixed(6);
          resultEl.innerHTML = `??<strong>${r.address_name}</strong> (${r.address_type})`;
        } else {
          resultEl.innerHTML = '<span style="color:#e03131;">寃???寃곌낵媛? ??????? ?ㅻⅨ 二쇱??瑜??????????</span>';
        }
      });
    }

    async function generateQR() {
      const errEl = document.getElementById('qrCreateError');
      errEl.classList.remove('show');

      const alwaysValid = document.getElementById('chkAlways').checked;
      const noLocation = document.getElementById('chkNoLocation').checked;

      let validFrom = null, validUntil = null;
      if (!alwaysValid) {
        validFrom = document.getElementById('validFrom').value ? new Date(document.getElementById('validFrom').value).toISOString() : null;
        validUntil = document.getElementById('validUntil').value ? new Date(document.getElementById('validUntil').value).toISOString() : null;
      }

      let locationData = {};
      if (!noLocation) {
        if (!locCoords.lat || !locCoords.lng) {
          errEl.textContent = '??移?瑜??ㅼ?????? 二쇱??瑜?寃???????醫???瑜?????????';
          errEl.classList.add('show');
          return;
        }
        const radius = parseFloat(document.getElementById('locRadius').value);
        if (!radius || radius <= 0) {
          errEl.textContent = '????諛?寃??????????';
          errEl.classList.add('show');
          return;
        }
        locationData = {
          location_address: document.getElementById('locAddress').value.trim(),
          location_lat: locCoords.lat,
          location_lng: locCoords.lng,
          location_radius_km: radius
        };
      }

      const qrKey = crypto.randomUUID();

      const existingQR = qrCodesMap[currentItemId];
      if (existingQR) {
        await _sb.from('talent_qr_codes').update({ is_active: false }).eq('id', existingQR.id);
      }

      const insertData = {
        talent_item_id: currentItemId,
        qr_key: qrKey,
        valid_from: validFrom,
        valid_until: validUntil,
        is_active: true,
        created_by: session.id,
        ...locationData
      };

      const { data, error } = await _sb.from('talent_qr_codes').insert(insertData).select().single();
      if (error) {
        errEl.textContent = tErr(error.message);
        errEl.classList.add('show');
        return;
      }

      await logInfo('QR_CREATE', { itemId: currentItemId, qrCodeId: data.id, hasLocation: !noLocation, alwaysValid });
      closeQRCreateModal();
      await loadData();
      viewQR(currentItemId, document.getElementById('qrCreateTitle').textContent.replace(' - QR 肄??? ?앹??, ''));
    }

    async function viewQR(itemId, itemName) {
      const qr = qrCodesMap[itemId];
      if (!qr) { alert('????QR 肄???媛? ???????'); return; }

      currentQRId = qr.id;
      document.getElementById('qrViewTitle').textContent = `${itemName} - QR 肄???`;

      const wrap = document.getElementById('qrImageWrap');
      wrap.innerHTML = '';
      const canvas = document.createElement('canvas');
      wrap.appendChild(canvas);

      await QRCode.toCanvas(canvas, qr.qr_key, {
        width: 280, margin: 2,
        color: { dark: '#000000', light: '#ffffff' }
      });

      let info = '';
      if (qr.valid_from || qr.valid_until) {
        info += `??${qr.valid_from ? formatDT(qr.valid_from) : '???? ????'} ~ ${qr.valid_until ? formatDT(qr.valid_until) : '醫?猷? ????'}<br>`;
      } else {
        info += '???곸?? ?좏??br>';
      }
      if (qr.location_address) {
        info += `???${qr.location_address} (諛?寃?${qr.location_radius_km}km)`;
      } else {
        info += '?????移? ???? ????';
      }
      document.getElementById('qrViewInfo').innerHTML = info;
      document.getElementById('qrViewModal').classList.remove('hidden');
    }

    function closeQRViewModal() { document.getElementById('qrViewModal').classList.add('hidden'); }

    function downloadQR() {
      const canvas = document.querySelector('#qrImageWrap canvas');
      if (!canvas) return;
      const link = document.createElement('a');
      link.download = `qr_talent_${currentQRId}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function printQR() {
      const canvas = document.querySelector('#qrImageWrap canvas');
      if (!canvas) return;
      const win = window.open('', '_blank');
      win.document.write(`<html><head><title>QR ?몄??</title></head><body style="text-align:center;padding:2rem;">
        <h2>${document.getElementById('qrViewTitle').textContent}</h2>
        <img src="${canvas.toDataURL('image/png')}" style="max-width:400px;"/><br>
        <p>${document.getElementById('qrViewInfo').innerHTML}</p>
        <script>window.print();<\/script></body></html>`);
    }

    async function deactivateQR() {
      if (!currentQRId) return;
      if (!confirm('??QR 肄???瑜?鍮????깊??????寃좎???源??\n湲곗〈 QR 肄???濡??? ???댁???щ??몃? ??????????????')) return;
      await _sb.from('talent_qr_codes').update({ is_active: false }).eq('id', currentQRId);
      await logInfo('QR_DEACTIVATE', { qrCodeId: currentQRId });
      closeQRViewModal();
      await loadData();
    }

    async function openScanLog(itemId, itemName) {
      document.getElementById('scanLogTitle').textContent = `${itemName} - ?ㅼ? ?대젰`;
      document.getElementById('scanLogModal').classList.remove('hidden');
      const content = document.getElementById('scanLogContent');
      content.innerHTML = '<div style="text-align:center;color:var(--admin-text-muted);">遺???ㅻ?? 以?..</div>';

      const { data: scans } = await _sb.from('talent_qr_scans')
        .select('*, profiles:user_id(display_name, username)')
        .eq('talent_item_id', itemId)
        .order('created_at', { ascending: false })
        .limit(50);

      if (!scans || scans.length === 0) {
        content.innerHTML = '<div style="text-align:center;color:var(--admin-text-muted);padding:1rem;">?ㅼ? ?대젰?????????</div>';
        return;
      }

      content.innerHTML = scans.map(s => {
        const name = s.profiles ? (s.profiles.display_name || s.profiles.username) : '-';
        const ok = s.scan_result === 'success';
        const time = formatDT(s.created_at);
        return `<div class="scan-log-row">
          <span>${ok ? '?? : '??} ${name}</span>
          <span style="color:${ok ? '#2b8a3e' : '#e03131'};">${ok ? '?깃났' : (s.failure_reason || '?ㅽ??)}</span>
          <span style="color:#868e96;">${time}</span>
        </div>`;
      }).join('');
    }

    function closeScanLogModal() { document.getElementById('scanLogModal').classList.add('hidden'); }

    function formatDT(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    }

    document.getElementById('qrCreateModal').addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) closeQRCreateModal(); });
    document.getElementById('qrViewModal').addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) closeQRViewModal(); });
    document.getElementById('scanLogModal').addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) closeScanLogModal(); });
  </script>
