<!DOCTYPE html>
<html lang="ko" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>천국우체국 사연 관리 - 달란트 마을</title>
  <link rel="stylesheet" href="../css/themes.css" />
  <link rel="stylesheet" href="../css/admin.css" />
  <style>
    .story-preview { max-width:420px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .story-status { display:inline-flex; padding:.2rem .55rem; border-radius:999px; font-size:.78rem; font-weight:800; }
    .story-status.received { color:#e67700; background:#fff3bf; }.story-status.completed { color:#2b8a3e; background:#d3f9d8; }
    .story-detail { white-space:pre-wrap; line-height:1.7; background:var(--t-bg,#f8f9fa); border:1px solid var(--admin-border); border-radius:8px; padding:.9rem; }
    .story-meta { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.6rem; margin-bottom:1rem; font-size:.86rem; }.story-meta b { display:block; color:var(--admin-text-muted); font-size:.76rem; margin-bottom:.15rem; }
  </style>
</head>
<body class="admin-body">
  <div id="nav-container"></div>
  <main class="admin-container">
    <h2 style="margin-bottom:.5rem;">💌 천국우체국 사연 관리</h2>
    <p style="color:var(--admin-text-muted);margin-bottom:1.2rem;">익명 사연도 관리자는 작성자를 확인할 수 있습니다. 접수완료 처리 시 사연별로 한 번만 달란트가 지급됩니다.</p>
    <div class="filters" style="margin-bottom:1rem;"><button class="filter-btn active" data-status="" onclick="setStatusFilter('')">전체</button><button class="filter-btn" data-status="received" onclick="setStatusFilter('received')">접수</button><button class="filter-btn" data-status="completed" onclick="setStatusFilter('completed')">접수완료</button></div>
    <div class="admin-table-wrap" id="story-list"><table class="admin-table"><thead><tr><th>상태</th><th>작성자</th><th>익명</th><th>사연</th><th>신청곡</th><th>등록일</th><th>관리</th></tr></thead><tbody id="storyList"><tr><td colspan="7" class="empty-state">로딩 중...</td></tr></tbody></table></div>
  </main>
  <div class="modal-overlay hidden" id="storyDetailModal"><div class="modal-box" style="max-width:720px;"><div style="display:flex;justify-content:space-between;gap:.6rem;"><h3 class="modal-title">사연 상세</h3><button class="btn-cancel" onclick="closeStoryDetail()">닫기</button></div><div id="storyDetail"></div><div class="modal-actions" id="storyDetailActions"></div></div></div>
  <script crossorigin="anonymous" src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
  <script src="../config/public-config.js"></script><script src="../js/supabase-config.js"></script><script src="../js/activity-log.js"></script><script src="../js/codes.js"></script><script src="../js/auth.js"></script><script src="../js/theme.js"></script><script src="../js/nav.js"></script>
  <script>
    initSupabase(); let stories = [], statusFilter = '', adminSession = null, departmentNames = {};
    const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[ch]);
    const date = value => value ? new Intl.DateTimeFormat('ko-KR',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Seoul'}).format(new Date(value)) : '-';
    (async () => { await navInit(); adminSession = await initPage(90, '../login.html'); if (!adminSession) return; navUpdateAuth(adminSession); await initTheme(); loadStories(); })();
    async function loadStories() {
      const list = document.getElementById('storyList'); list.innerHTML = '<tr><td colspan="7" class="empty-state">로딩 중...</td></tr>';
      let query = _sb.from('story_submissions').select('id,is_anonymous,story_content,song_request,status,created_at,completed_at,reward_amount,author:profiles!story_submissions_author_id_fkey(display_name,username,department_id)').order('created_at',{ascending:false});
      if (statusFilter) query = query.eq('status', statusFilter);
      const [{ data, error }, { data: departments }] = await Promise.all([
        query,
        _sb.from('departments').select('id,name')
      ]);
      if (error) { list.innerHTML = '<tr><td colspan="7" class="empty-state">사연을 불러오지 못했습니다. SQL 적용 여부를 확인해주세요.<br>' + esc(error.message) + '</td></tr>'; return; }
      departmentNames = Object.fromEntries((departments || []).map(department => [department.id, department.name]));
      stories = data || [];
      list.innerHTML = stories.length ? stories.map(row => `<tr><td><span class="story-status ${row.status}">${row.status === 'completed' ? '접수완료' : '접수'}</span></td><td>${esc(row.author?.display_name || '-')} <small>(${esc(row.author?.username || '-')})<br />${esc(departmentNames[row.author?.department_id] || '부서 미지정')}</small></td><td>${row.is_anonymous ? '익명' : '실명'}</td><td class="story-preview">${esc(row.story_content)}</td><td>${esc(row.song_request || '-')}</td><td>${date(row.created_at)}</td><td><button class="filter-btn" onclick="openStoryDetail('${row.id}')">상세</button></td></tr>`).join('') : '<tr><td colspan="7" class="empty-state">사연이 없습니다.</td></tr>';
    }
    function setStatusFilter(status) { statusFilter = status; document.querySelectorAll('[data-status]').forEach(el => el.classList.toggle('active', el.dataset.status === status)); loadStories(); }
    function openStoryDetail(id) {
      const row = stories.find(item => item.id === id); if (!row) return;
      const author = row.author || {};
      document.getElementById('storyDetail').innerHTML = `<div class="story-meta"><div><b>작성자</b>${esc(author.display_name || '-')} (${esc(author.username || '-')})<br />${esc(departmentNames[author.department_id] || '부서 미지정')}</div><div><b>익명 여부</b>${row.is_anonymous ? '익명 요청' : '실명 공개'}</div><div><b>접수 상태</b>${row.status === 'completed' ? `접수완료 · +${esc(row.reward_amount)} 달란트` : '접수'}</div><div><b>등록 일시</b>${date(row.created_at)}</div></div><b>사연</b><div class="story-detail">${esc(row.story_content)}</div><div style="margin-top:1rem;"><b>신청곡</b><div class="story-detail" style="margin-top:.35rem;">${esc(row.song_request || '신청곡 없음')}</div></div>`;
      document.getElementById('storyDetailActions').innerHTML = row.status === 'received' ? `<button class="btn-cancel" onclick="closeStoryDetail()">취소</button><button class="btn-confirm" onclick="completeStory('${row.id}', this)">접수완료 및 달란트 지급</button>` : '<button class="btn-cancel" onclick="closeStoryDetail()">닫기</button>';
      document.getElementById('storyDetailModal').classList.remove('hidden');
    }
    function closeStoryDetail() { document.getElementById('storyDetailModal').classList.add('hidden'); }
    async function completeStory(id, button) {
      if (!confirm('정상 접수로 처리하고 현재 활성화된 “천국우체국 사연 등록” 항목의 달란트를 지급할까요? 이 작업은 되돌릴 수 없습니다.')) return;
      button.disabled = true; button.textContent = '처리 중...';
      try { const { data, error } = await _sb.rpc('complete_story_submission',{p_submission_id:id}); if (error) throw error; if (!data || data.success === false) throw new Error((data && data.error) || '처리에 실패했습니다.'); await logInfo('STORY_SUBMISSION_COMPLETE',{사연ID:id, 지급달란트:data.amount, 거래ID:data.transaction_id}); closeStoryDetail(); await loadStories(); alert(`접수완료 처리되었습니다. ${data.amount} 달란트가 지급되었습니다.`); } catch (err) { alert(err.message || String(err)); button.disabled = false; button.textContent = '접수완료 및 달란트 지급'; }
    }
    document.getElementById('storyDetailModal').addEventListener('click', event => { if (event.target.id === 'storyDetailModal') closeStoryDetail(); });
  </script>
  <div id="version-container"></div><script src="../js/version.js"></script>
</body>
</html>
