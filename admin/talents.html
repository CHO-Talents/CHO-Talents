<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달란트 관리 - CHO Talents Admin</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="../index.html" class="admin-nav-brand">CHO-Talents</a>
    <ul class="admin-nav-links">
      <li data-min-perm="80"><a href="index.html">대시보드</a></li>
      <li data-min-perm="60"><a href="users.html" id="navUsers">사용자 관리 <span class="badge hidden" id="navUserBadge">0</span></a></li>
      <li data-min-perm="80"><a href="departments.html">부서 관리</a></li>
      <li data-min-perm="80"><a href="managers.html">관리자 관리</a></li>
      <li data-min-perm="40"><a href="talents.html" class="active">달란트 관리</a></li>
      <li data-min-perm="60"><a href="shop.html">물품 관리</a></li>
      <li data-min-perm="80"><a href="reports.html">보고서</a></li>
      <li data-min-perm="100"><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li data-min-perm="80"><a href="versions.html">버전</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">💰 달란트 관리</h2>

    <div class="filters" style="margin-bottom:1rem;">
      <button class="filter-btn active" id="tabStudent" onclick="switchTab('student')">🎒 학생</button>
      <button class="filter-btn" id="tabTeacher" onclick="switchTab('teacher')">👩‍🏫 교사</button>
    </div>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title" id="tableTitle">학생 목록</div>
        <button class="filter-btn" style="background:var(--admin-primary);color:#fff;" onclick="openAddModal()">+ 사용자 등록</button>
      </div>
      <table class="admin-table">
        <thead><tr><th>이름</th><th>부서</th><th>반</th><th>달란트</th><th>등록일</th><th>관리</th></tr></thead>
        <tbody id="userList"><tr><td colspan="6" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay hidden" id="userModal">
    <div class="modal-box">
      <h3 class="modal-title" id="modalTitle">사용자 등록</h3>
      <div class="form-error" id="modalError"></div>
      <div style="margin-bottom:0.8rem;" id="usernameWrap">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">아이디</label>
        <input type="text" id="mUsername" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" placeholder="영문/숫자" />
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">이름</label>
        <input type="text" id="mDisplayName" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" placeholder="표시 이름" />
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-confirm" onclick="saveUser()">저장</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="talentModal">
    <div class="modal-box" style="max-width:500px;">
      <h3 class="modal-title" id="talentTitle">달란트 관리</h3>
      <div style="text-align:center;margin-bottom:1rem;">
        <div style="font-size:0.85rem;color:var(--admin-text-muted);">현재 잔액</div>
        <div style="font-size:2rem;font-weight:800;" id="talentBalance">0</div>
      </div>
      <div style="display:flex;gap:0.5rem;margin-bottom:0.8rem;">
        <button class="filter-btn" id="btnEarn" onclick="setTalentType('earn')" style="flex:1;padding:0.6rem;background:#51cf66;color:#fff;border-color:#51cf66;">적립</button>
        <button class="filter-btn" id="btnUse" onclick="setTalentType('use')" style="flex:1;padding:0.6rem;">사용</button>
      </div>

      <div id="earnSection">
        <div style="font-weight:700;font-size:0.85rem;margin-bottom:0.5rem;">항목 선택</div>
        <div id="talentItemBtns" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:0.8rem;"></div>
        <details style="margin-bottom:0.8rem;">
          <summary style="cursor:pointer;font-size:0.85rem;color:var(--admin-primary);">수동 입력 (항목에 없는 경우)</summary>
          <div style="display:flex;gap:0.5rem;margin-top:0.5rem;">
            <input type="number" id="talentAmount" min="1" style="flex:1;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" placeholder="금액" />
            <input type="text" id="talentDesc" style="flex:2;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" placeholder="사유" />
          </div>
          <div style="margin-top:0.5rem;">
            <button class="btn-confirm" onclick="submitManualTalent()" style="width:100%;padding:0.5rem;">수동 적립</button>
          </div>
        </details>
      </div>

      <div id="useSection" style="display:none;">
        <div style="margin-bottom:0.8rem;">
          <input type="number" id="useAmount" min="1" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" placeholder="사용 금액" />
        </div>
        <div style="margin-bottom:0.8rem;">
          <input type="text" id="useDesc" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" placeholder="사유 (예: 상품 구매)" />
        </div>
        <button class="btn-confirm" onclick="submitUseTalent()" style="width:100%;padding:0.5rem;background:#ff6b6b;border-color:#ff6b6b;">사용 처리</button>
      </div>

      <div class="form-error" id="talentError"></div>
      <div class="modal-actions" style="margin-top:0.8rem;">
        <button class="btn-cancel" onclick="closeTalentModal()">닫기</button>
      </div>
      <div style="margin-top:1rem;border-top:1px solid var(--admin-border);padding-top:0.8rem;">
        <div style="font-weight:700;font-size:0.85rem;margin-bottom:0.5rem;">최근 내역</div>
        <div id="talentHistory" style="max-height:200px;overflow-y:auto;font-size:0.82rem;"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=3.7.2"></script>
  <script src="../js/activity-log.js?v=3.7.2"></script>
  <script src="../js/auth.js?v=3.7.2"></script>
  <script src="../js/user-mgmt.js?v=3.7.2"></script>
  <script src="../js/talent.js?v=3.7.2"></script>
  <script>
    initSupabase();
    let session;
    let editingId = null;
    let talentUserId = null;
    let talentType = 'earn';
    let currentTab = 'student';
    let allDepts = [];
    let talentItems = [];

    (async () => {
      session = await initPage(40, '../login.html');
      if (!session) return;
      applyPermNav(session.permissionRank || 0);
      renderRoleBadge('navUser', session, '../');
      autoLogPageView();
      updatePendingBadge();
      const [deptRes, itemRes] = await Promise.all([
        fetchDepartments(),
        fetchAllTalentItems()
      ]);
      allDepts = deptRes.data || [];
      talentItems = itemRes.data || [];
      loadUsers();
    })();

    function getDeptName(id) {
      const d = allDepts.find(d => d.id === id);
      return d ? d.name : '-';
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabStudent').classList.toggle('active', tab === 'student');
      document.getElementById('tabTeacher').classList.toggle('active', tab === 'teacher');
      loadUsers();
    }

    async function loadUsers() {
      const myRank = session.permissionRank || 0;
      const roleLabel = currentTab === 'student' ? '학생' : '교사';
      const opts = { userType: currentTab };

      if (myRank < 80) {
        if (myRank >= 60 && session.managedDeptId) {
          opts.departmentId = session.managedDeptId;
        } else if (myRank === 40 && session.departmentId) {
          opts.departmentId = session.departmentId;
        }
      }

      let { data } = await fetchUsers(opts);
      data = data || [];

      if (myRank === 40 && session.classNumber != null) {
        data = data.filter(u => u.class_number === session.classNumber);
      }

      const tbody = document.getElementById('userList');
      document.getElementById('tableTitle').textContent = `${roleLabel} 목록 (${data.length}명)`;

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">등록된 ${roleLabel}이(가) 없습니다.</td></tr>`;
        return;
      }

      const nameMap = resolveDisplayNames(data);
      const showId = isAdminLevel(session);
      const showManage = myRank >= 60;
      tbody.innerHTML = data.map(u => {
        const dn = nameMap[u.id] || u.display_name || '-';
        const classLabel = u.class_number ? u.class_number + '반' : '-';
        return `<tr>
        <td>${dn}${showId ? ' <span style="font-size:0.72rem;color:#868e96;">(' + u.username + ')</span>' : ''}</td>
        <td>${getDeptName(u.department_id)}</td>
        <td>${classLabel}</td>
        <td style="font-weight:700;">${u.talent_balance || 0}</td>
        <td>${formatKSTShort(u.created_at)}</td>
        <td>
          <button class="filter-btn" onclick="openTalentModal('${u.id}','${dn.replace(/'/g,"\\'")}',${u.talent_balance || 0})">달란트</button>
          ${showManage ? `<button class="filter-btn" onclick="openEditModal('${u.id}','${u.username}','${(u.display_name || '').replace(/'/g,"\\'")}')">수정</button>` : ''}
          ${showManage ? `<button class="btn-ack" onclick="confirmDelete('${u.id}','${dn.replace(/'/g,"\\'")}')">삭제</button>` : ''}
        </td>
      </tr>`;
      }).join('');
    }

    function openAddModal() {
      editingId = null;
      const label = currentTab === 'student' ? '학생' : '교사';
      document.getElementById('modalTitle').textContent = `${label} 등록`;
      document.getElementById('usernameWrap').style.display = isAdminLevel(session) ? 'block' : 'none';
      document.getElementById('mUsername').value = '';
      document.getElementById('mUsername').disabled = false;
      document.getElementById('mDisplayName').value = '';
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('userModal').classList.remove('hidden');
    }

    function openEditModal(id, username, displayName) {
      editingId = id;
      const label = currentTab === 'student' ? '학생' : '교사';
      document.getElementById('modalTitle').textContent = `${label} 수정`;
      document.getElementById('usernameWrap').style.display = isAdminLevel(session) ? 'block' : 'none';
      document.getElementById('mUsername').value = username;
      document.getElementById('mUsername').disabled = true;
      document.getElementById('mDisplayName').value = displayName;
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('userModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('userModal').classList.add('hidden'); }

    async function saveUser() {
      const errEl = document.getElementById('modalError');
      let username = document.getElementById('mUsername').value.trim();
      const displayName = document.getElementById('mDisplayName').value.trim();
      if (!displayName) { errEl.textContent = '이름을 입력해주세요.'; errEl.classList.add('show'); return; }
      if (!editingId && !username) username = 'u_' + Date.now().toString(36);

      if (editingId) {
        const { error } = await updateUser(editingId, { displayName });
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      } else {
        const { error } = await createUser({
          username, displayName: displayName || username,
          userType: currentTab,
          departmentId: session.managedDeptId || null
        });
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      }
      closeModal();
      await loadUsers();
    }

    async function confirmDelete(id, username) {
      const label = currentTab === 'student' ? '학생' : '교사';
      if (!confirm(`"${username}" ${label}을(를) 삭제하시겠습니까?`)) return;
      await deleteUser(id);
      await loadUsers();
    }

    function openTalentModal(userId, name, balance) {
      talentUserId = userId;
      talentType = 'earn';
      document.getElementById('talentTitle').textContent = `${name} - 달란트 관리`;
      document.getElementById('talentBalance').textContent = balance;
      document.getElementById('talentError').classList.remove('show');
      setTalentType('earn');
      renderTalentItemButtons();
      document.getElementById('talentModal').classList.remove('hidden');
      loadTalentHistory(userId);
    }

    function closeTalentModal() { document.getElementById('talentModal').classList.add('hidden'); }

    function setTalentType(type) {
      talentType = type;
      const eb = document.getElementById('btnEarn'), ub = document.getElementById('btnUse');
      document.getElementById('earnSection').style.display = type === 'earn' ? 'block' : 'none';
      document.getElementById('useSection').style.display = type === 'use' ? 'block' : 'none';
      if (type === 'earn') {
        eb.style.cssText = 'flex:1;padding:0.6rem;background:#51cf66;color:#fff;border-color:#51cf66;';
        ub.style.cssText = 'flex:1;padding:0.6rem;';
      } else {
        ub.style.cssText = 'flex:1;padding:0.6rem;background:#ff6b6b;color:#fff;border-color:#ff6b6b;';
        eb.style.cssText = 'flex:1;padding:0.6rem;';
      }
    }

    function renderTalentItemButtons() {
      const items = talentItems.filter(i => i.target_type === currentTab && i.is_active);
      const container = document.getElementById('talentItemBtns');
      if (items.length === 0) {
        container.innerHTML = '<div style="color:var(--admin-text-muted);font-size:0.85rem;">등록된 항목이 없습니다.</div>';
        return;
      }
      container.innerHTML = items.map(i =>
        `<button class="filter-btn" onclick="giveByItem('${i.id}','${i.name}',${i.talent_amount})" style="padding:0.5rem 1rem;font-size:0.9rem;" title="${i.name}: +${i.talent_amount} 달란트">${i.name} <strong style="color:#2b8a3e;">+${i.talent_amount}</strong></button>`
      ).join('');
    }

    async function giveByItem(itemId, itemName, amount) {
      const errEl = document.getElementById('talentError');
      errEl.classList.remove('show');
      const result = await giveTalentByItem(talentUserId, itemId, session.id);
      if (result.success === false) {
        errEl.textContent = result.error || '지급 실패';
        errEl.classList.add('show');
        return;
      }
      document.getElementById('talentBalance').textContent = result.balance;
      errEl.classList.remove('show');
      await loadTalentHistory(talentUserId);
      await loadUsers();
    }

    async function submitManualTalent() {
      const errEl = document.getElementById('talentError');
      const amount = parseInt(document.getElementById('talentAmount').value);
      const desc = document.getElementById('talentDesc').value.trim();
      if (!amount || amount <= 0) { errEl.textContent = '유효한 금액을 입력해주세요.'; errEl.classList.add('show'); return; }
      if (!desc) { errEl.textContent = '사유를 입력해주세요.'; errEl.classList.add('show'); return; }
      const result = await giveTalent(talentUserId, amount, desc, session.id);
      if (result.success === false) { errEl.textContent = result.error || '처리 실패'; errEl.classList.add('show'); return; }
      document.getElementById('talentBalance').textContent = result.balance;
      document.getElementById('talentAmount').value = '';
      document.getElementById('talentDesc').value = '';
      errEl.classList.remove('show');
      await loadTalentHistory(talentUserId);
      await loadUsers();
    }

    async function submitUseTalent() {
      const errEl = document.getElementById('talentError');
      const amount = parseInt(document.getElementById('useAmount').value);
      const desc = document.getElementById('useDesc').value.trim();
      if (!amount || amount <= 0) { errEl.textContent = '유효한 금액을 입력해주세요.'; errEl.classList.add('show'); return; }
      if (!desc) { errEl.textContent = '사유를 입력해주세요.'; errEl.classList.add('show'); return; }
      const result = await useTalent(talentUserId, amount, desc, session.id);
      if (result.success === false) { errEl.textContent = result.error || '처리 실패'; errEl.classList.add('show'); return; }
      document.getElementById('talentBalance').textContent = result.balance;
      document.getElementById('useAmount').value = '';
      document.getElementById('useDesc').value = '';
      errEl.classList.remove('show');
      await loadTalentHistory(talentUserId);
      await loadUsers();
    }

    async function loadTalentHistory(userId) {
      const { data } = await fetchTalentHistory(userId, { limit: 10 });
      const el = document.getElementById('talentHistory');
      if (!data || data.length === 0) { el.innerHTML = '<div style="color:var(--admin-text-muted);text-align:center;">내역 없음</div>'; return; }
      el.innerHTML = data.map(t => `
        <div style="display:flex;justify-content:space-between;padding:0.3rem 0;border-bottom:1px solid #f0f0f0;">
          <span>${formatKSTShort(t.created_at)}</span>
          <span style="color:${t.type === 'earn' ? '#2b8a3e' : '#e03131'};font-weight:700;">${t.type === 'earn' ? '+' : '-'}${t.amount}</span>
          <span style="color:var(--admin-text-muted);">${t.description || '-'}</span>
        </div>`).join('');
    }

    document.getElementById('userModal').addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) closeModal(); });
    document.getElementById('talentModal').addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) closeTalentModal(); });
  </script>
  <script src="../js/version.js?v=3.7.2"></script>
</body>
</html>
