<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달란트 상점 조회 - 관리자</title>
  <link rel="stylesheet" href="../css/admin.css" />
  <style>
    .shop-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    .shop-tab {
      padding: 0.6rem 1.5rem; border-radius: 50px; border: 2px solid var(--admin-border);
      background: #fff; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: all 0.2s;
    }
    .shop-tab.active { background: var(--admin-primary); color: #fff; border-color: var(--admin-primary); }
    .shop-tab:hover:not(.active) { border-color: var(--admin-primary); color: var(--admin-primary); }

    .product-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem;
    }
    .product-card {
      background: #fff; border-radius: 16px; padding: 1.2rem; text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); border: 2px solid transparent; transition: all 0.2s;
    }
    .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
    .product-card img { width: 100%; max-height: 140px; object-fit: cover; border-radius: 10px; margin-bottom: 0.6rem; }
    .product-card .p-emoji { font-size: 3rem; margin-bottom: 0.6rem; display: block; }
    .product-card .p-name { font-weight: 800; font-size: 1rem; margin-bottom: 0.3rem; }
    .product-card .p-price { font-weight: 700; color: var(--admin-primary); font-size: 1.1rem; margin-bottom: 0.3rem; }
    .product-card .p-price .unit { font-size: 0.8rem; font-weight: 500; color: #636e72; }
    .product-card .p-desc { font-size: 0.85rem; color: #636e72; margin-bottom: 0.4rem; }
    .product-card .p-stock { font-size: 0.8rem; color: #b2bec3; }
    .product-card .p-stock.low { color: #e03131; font-weight: 700; }
    .product-card .p-cat { display: inline-block; font-size: 0.75rem; background: #f1f3f5; padding: 0.15rem 0.6rem; border-radius: 50px; color: #636e72; margin-bottom: 0.4rem; }

    .section-title { font-size: 1.1rem; font-weight: 800; margin: 1.5rem 0 0.8rem; color: #2d3436; }
    .shop-summary { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .shop-summary .ss { background: #f8f9fa; padding: 0.5rem 1rem; border-radius: 10px; font-size: 0.9rem; }
    .shop-summary .ss strong { color: var(--admin-primary); }
  </style>
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="index.html" class="admin-nav-brand">CHO-Talents Admin</a>
    <ul class="admin-nav-links">
      <li><a href="../index.html">🏠 메인</a></li>
      <li><a href="index.html">대시보드</a></li>
      <li><a href="departments.html">부서 관리</a></li>
      <li><a href="managers.html">관리자 관리</a></li>
      <li><a href="shop.html" class="active">상점 조회</a></li>
      <li><a href="reports.html">보고서</a></li>
      <li><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">🛒 달란트 상점 조회</h2>

    <div class="shop-tabs">
      <button class="shop-tab active" onclick="switchTab('student', this)">🎒 학생 상점</button>
      <button class="shop-tab" onclick="switchTab('teacher', this)">👩‍🏫 교사 상점</button>
      <button class="shop-tab" onclick="switchTab('all', this)">📦 전체 상품</button>
    </div>

    <div class="shop-summary" id="shopSummary"></div>

    <div id="productArea">
      <div class="empty-state" style="padding:2rem;text-align:center;">⏳ 상품을 불러오는 중...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/activity-log.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/product.js"></script>
  <script>
    initSupabase();
    const session = requireRole(['admin'], '../login.html');
    let allProducts = [];
    let currentTab = 'student';

    if (session) {
      document.getElementById('navUser').textContent = session.displayName || session.username;
      autoLogPageView();
      updateBadge();
      loadAllProducts();
    }

    async function updateBadge() {
      const cnt = await getUnacknowledgedCount();
      if (cnt > 0) {
        const b = document.getElementById('navLogBadge');
        b.textContent = cnt; b.classList.remove('hidden');
      }
    }

    async function loadAllProducts() {
      const { data } = await fetchProducts(null, { activeOnly: false });
      allProducts = data || [];
      renderProducts();
    }

    function switchTab(tab, btn) {
      currentTab = tab;
      document.querySelectorAll('.shop-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function renderProducts() {
      const filtered = currentTab === 'all'
        ? allProducts
        : allProducts.filter(p => p.target_role === currentTab);

      const active = filtered.filter(p => p.is_active);
      const inactive = filtered.filter(p => !p.is_active);

      const summaryEl = document.getElementById('shopSummary');
      const tabLabel = currentTab === 'student' ? '학생' : currentTab === 'teacher' ? '교사' : '전체';
      summaryEl.innerHTML = `
        <div class="ss">📦 ${tabLabel} 상품: <strong>${filtered.length}개</strong></div>
        <div class="ss">✅ 활성: <strong>${active.length}개</strong></div>
        ${inactive.length > 0 ? `<div class="ss">⛔ 비활성: <strong>${inactive.length}개</strong></div>` : ''}
      `;

      const area = document.getElementById('productArea');
      if (filtered.length === 0) {
        area.innerHTML = '<div class="empty-state" style="padding:2rem;text-align:center;">📦 등록된 상품이 없습니다.</div>';
        return;
      }

      let html = '';

      if (currentTab === 'all') {
        const studentItems = filtered.filter(p => p.target_role === 'student');
        const teacherItems = filtered.filter(p => p.target_role === 'teacher');
        if (studentItems.length > 0) {
          html += `<div class="section-title">🎒 학생 상품 (${studentItems.length}개)</div>`;
          html += buildGrid(studentItems);
        }
        if (teacherItems.length > 0) {
          html += `<div class="section-title">👩‍🏫 교사 상품 (${teacherItems.length}개)</div>`;
          html += buildGrid(teacherItems);
        }
      } else {
        const categories = {};
        filtered.forEach(p => {
          const cat = p.category || '기타';
          if (!categories[cat]) categories[cat] = [];
          categories[cat].push(p);
        });

        for (const [cat, items] of Object.entries(categories)) {
          html += `<div class="section-title">${cat} (${items.length}개)</div>`;
          html += buildGrid(items);
        }
      }

      area.innerHTML = html;
    }

    function buildGrid(items) {
      return '<div class="product-grid">' + items.map(p => `
        <div class="product-card" ${!p.is_active ? 'style="opacity:0.5;"' : ''}>
          ${p.image_url
            ? `<img src="${p.image_url}" alt="${p.name}" />`
            : `<span class="p-emoji">${p.image_emoji || '🎁'}</span>`}
          <div class="p-name">${p.name}</div>
          ${p.category ? `<span class="p-cat">${p.category}</span>` : ''}
          <div class="p-price">${p.price} <span class="unit">달란트</span></div>
          <div class="p-desc">${p.description || ''}</div>
          <div class="p-stock ${p.stock <= 5 ? 'low' : ''}">
            재고: ${p.stock}개 ${p.stock <= 5 ? '(품절 임박!)' : ''} ${!p.is_active ? '(비활성)' : ''}
          </div>
        </div>
      `).join('') + '</div>';
    }
  </script>
</body>
</html>
