<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>사용자 관리 - 관리자</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="../index.html" class="admin-nav-brand">CHO-Talents</a>
    <ul class="admin-nav-links">
      <li data-min-perm="80"><a href="index.html">대시보드</a></li>
      <li data-min-perm="60"><a href="users.html" class="active">사용자 관리</a></li>
      <li data-min-perm="80"><a href="departments.html">부서 관리</a></li>
      <li data-min-perm="80"><a href="managers.html">관리자 관리</a></li>
      <li data-min-perm="40"><a href="talents.html">달란트 관리</a></li>
      <li data-min-perm="60"><a href="shop.html">물품 관리</a></li>
      <li data-min-perm="80"><a href="reports.html">보고서</a></li>
      <li data-min-perm="100"><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li data-min-perm="80"><a href="versions.html">버전</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">👥 사용자 관리</h2>

    <div class="cards-grid" style="margin-bottom:1.5rem;">
      <div class="stat-card"><div class="stat-card-label">전체</div><div class="stat-card-value" id="cntAll">-</div></div>
      <div class="stat-card" style="border-left-color:#e03131;" data-min-perm="80"><div class="stat-card-label">👑 관리자</div><div class="stat-card-value" id="cntAdmin">-</div></div>
      <div class="stat-card" style="border-left-color:#cc5de8;" data-min-perm="80"><div class="stat-card-label">📋 부서관리자</div><div class="stat-card-value" id="cntMgr">-</div></div>
      <div class="stat-card" style="border-left-color:#4dabf7;"><div class="stat-card-label">👩‍🏫 교사</div><div class="stat-card-value" id="cntTeacher">-</div></div>
      <div class="stat-card" style="border-left-color:#51cf66;"><div class="stat-card-label">🎒 학생</div><div class="stat-card-value" id="cntStudent">-</div></div>
    </div>

    <!-- 가입 신청 내역 -->
    <div class="admin-table-wrap" id="reqSection" style="margin-bottom:1.5rem;">
      <div class="admin-table-header">
        <div class="admin-table-title" id="reqTitle" style="color:#e67700;">📝 가입 신청 내역</div>
      </div>
      <table class="admin-table">
        <thead><tr><th>역할</th><th>이름</th><th>부서</th><th>사유</th><th>신청일</th><th>처리</th></tr></thead>
        <tbody id="reqList"></tbody>
      </table>
    </div>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title" id="tableTitle">사용자 목록</div>
        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('all',this)">전체</button>
          <button class="filter-btn" data-min-perm="80" onclick="setFilter('admin',this)">관리자</button>
          <button class="filter-btn" data-min-perm="80" onclick="setFilter('dept_manager',this)">부서관리자</button>
          <button class="filter-btn" onclick="setFilter('teacher',this)">교사</button>
          <button class="filter-btn" onclick="setFilter('student',this)">학생</button>
          <span style="margin-left:0.5rem;"></span>
          <button class="filter-btn" style="background:var(--admin-primary);color:#fff;" onclick="openAddModal()">+ 사용자 등록</button>
        </div>
      </div>
      <table class="admin-table">
        <thead><tr><th>역할</th><th>권한</th><th>이름</th><th>부서</th><th>반</th><th>달란트</th><th>등록일</th><th>마지막 로그인</th><th>관리</th></tr></thead>
        <tbody id="userList"><tr><td colspan="9" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <!-- 사용자 등록/수정 모달 -->
  <div class="modal-overlay hidden" id="userModal">
    <div class="modal-box" style="max-width:500px;">
      <h3 class="modal-title" id="modalTitle">사용자 등록</h3>
      <div class="form-error" id="modalError"></div>
      <div style="margin-bottom:0.8rem;" id="usernameWrap">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">아이디</label>
        <input type="text" id="mUsername" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">이름 (표시명)</label>
        <input type="text" id="mDisplayName" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
      </div>
      <div style="display:flex;gap:0.8rem;margin-bottom:0.8rem;">
        <div style="flex:1;">
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">역할</label>
          <select id="mUserType" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" onchange="onUserTypeChange()">
            <option value="student">🎒 학생</option>
            <option value="teacher">👩‍🏫 교사</option>
          </select>
        </div>
        <div style="flex:1;" id="permLevelWrap">
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">권한</label>
          <select id="mPermLevel" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" onchange="onPermLevelChange()">
          </select>
        </div>
      </div>
      <div style="display:flex;gap:0.8rem;margin-bottom:0.8rem;">
        <div style="flex:1;">
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">소속 부서 <span style="color:#e03131;">*</span></label>
          <select id="mDept" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" onchange="onDeptChange()">
            <option value="">없음</option>
          </select>
        </div>
        <div style="flex:1;" id="classWrap">
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">반</label>
          <select id="mClassNumber" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;">
            <option value="">없음</option>
          </select>
        </div>
      </div>
      <div id="managedDeptWrap" style="margin-bottom:0.8rem;display:none;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">담당 관리 부서 <span style="color:#e03131;">*필수</span></label>
        <select id="mManagedDept" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;">
          <option value="">없음</option>
        </select>
      </div>
      <div id="passwordWrap" style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">초기 비밀번호</label>
        <input type="text" id="mPassword" value="1234" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
        <div style="font-size:0.75rem;color:#b2bec3;margin-top:0.2rem;">첫 로그인 시 변경 필수</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-confirm" onclick="saveUser()">저장</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=3.6.0"></script>
  <script src="../js/activity-log.js?v=3.6.0"></script>
  <script src="../js/auth.js?v=3.6.0"></script>
  <script src="../js/user-mgmt.js?v=3.6.0"></script>
  <script src="../js/version.js?v=3.6.0"></script>
  <script>
    initSupabase();
    let session;
    let allUsers = [];
    let allDepts = [];
    let editingId = null;
    let currentFilter = 'all';
    (async () => {
      session = await initPage(60, '../login.html');
      if (!session) return;
      applyPermNav(session.permissionRank || 0);
      renderRoleBadge('navUser', session, '../');
      autoLogPageView();
      const myRank = session.permissionRank || 0;
      if (myRank >= 80) updateBadge();
      if (myRank < 80) {
        document.getElementById('reqSection').style.display = 'none';
        document.querySelectorAll('.admin-table-header .filter-btn[style*="background:var(--admin-primary)"]').forEach(b => b.style.display = 'none');
      }
      loadData();
    })();

    async function updateBadge() {
      const cnt = await getUnacknowledgedCount();
      if (cnt > 0) { const b = document.getElementById('navLogBadge'); b.textContent = cnt; b.classList.remove('hidden'); }
    }

    let allRequests = [];

    async function loadLastLogins() {
      const { data: loginLogs } = await _sb
        .from('activity_logs')
        .select('username, created_at')
        .eq('action', 'LOGIN_SUCCESS')
        .order('created_at', { ascending: false });
      if (!loginLogs) return;
      const lastLoginMap = {};
      loginLogs.forEach(log => {
        if (!lastLoginMap[log.username]) lastLoginMap[log.username] = log.created_at;
      });
      allUsers.forEach(u => {
        if (!u.last_sign_in_at && lastLoginMap[u.username]) u.last_sign_in_at = lastLoginMap[u.username];
      });
    }

    async function loadData() {
      const [usersRes, deptsRes, reqRes] = await Promise.all([
        fetchUsers(), fetchDepartments(),
        _sb.from('registration_requests').select('*').eq('status', 'pending').order('created_at', { ascending: false })
      ]);
      allUsers = usersRes.data || [];
      allDepts = deptsRes.data || [];
      allRequests = reqRes.data || [];
      await loadLastLogins();
      updateStats();
      renderUsers();
      populateDeptSelects();
      renderRequests();
    }

    const DEPT_MGR_LEVELS = ['evangelist', 'chief', 'dept_teacher'];

    const PERM_LEVELS = [
      { value: 'teacher', label: '일반 교사', rank: 40 },
      { value: 'dept_teacher', label: '부서 담당 교사', rank: 60 },
      { value: 'chief', label: '부장', rank: 80 },
      { value: 'evangelist', label: '전도사님', rank: 90 },
      { value: 'admin', label: '관리자', rank: 100 }
    ];

    function buildPermOptions(maxRank, selectedValue) {
      return PERM_LEVELS.filter(l => l.rank <= maxRank)
        .map(l => `<option value="${l.value}" ${l.value === selectedValue ? 'selected' : ''}>${PERMISSION_EMOJI[l.value]||''} ${l.label}</option>`)
        .join('');
    }

    function updateStats() {
      document.getElementById('cntAll').textContent = allUsers.length;
      document.getElementById('cntAdmin').textContent = allUsers.filter(u => u.permission_level === 'admin').length;
      document.getElementById('cntMgr').textContent = allUsers.filter(u => DEPT_MGR_LEVELS.includes(u.permission_level)).length;
      document.getElementById('cntTeacher').textContent = allUsers.filter(u => u.user_type === 'teacher').length;
      document.getElementById('cntStudent').textContent = allUsers.filter(u => u.user_type === 'student').length;
    }

    function userMatchesFilter(u, filter) {
      if (filter === 'admin') return u.permission_level === 'admin';
      if (filter === 'dept_manager') return DEPT_MGR_LEVELS.includes(u.permission_level);
      if (filter === 'teacher') return u.user_type === 'teacher';
      if (filter === 'student') return u.user_type === 'student';
      return u.user_type === filter || u.permission_level === filter;
    }

    function badgeKeyForUser(u) {
      if (u.permission_level === 'admin') return 'admin';
      if (DEPT_MGR_LEVELS.includes(u.permission_level)) return 'dept_manager';
      if (u.user_type === 'teacher') return 'teacher';
      return 'student';
    }

    function populateDeptSelects() {
      const opts = '<option value="">없음</option>' + allDepts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
      document.getElementById('mDept').innerHTML = opts;
      document.getElementById('mManagedDept').innerHTML = opts;
    }

    function getClassLabel(classNum) {
      return classNum ? classNum + '반' : '-';
    }

    function onDeptChange() {
      const deptId = document.getElementById('mDept').value;
      const classSelect = document.getElementById('mClassNumber');
      const dept = allDepts.find(d => d.id === deptId);
      const count = (dept && dept.class_count) ? dept.class_count : 0;
      let html = '<option value="">없음</option>';
      for (let i = 1; i <= count; i++) html += `<option value="${i}">${i}반</option>`;
      classSelect.innerHTML = html;
      document.getElementById('classWrap').style.display = count > 0 ? 'block' : 'none';
    }

    function setFilter(role, btn) {
      currentFilter = role;
      document.querySelectorAll('.admin-table-header .filter-btn:not([style*="background:var(--admin-primary)"])').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderUsers();
    }

    function getDeptName(id) {
      const d = allDepts.find(d => d.id === id);
      return d ? d.name : '-';
    }

    const ROLE_BADGES = {
      admin: { emoji: '👑', label: '관리자', cls: 'ERROR' },
      dept_manager: { emoji: '📋', label: '부서관리자', cls: 'WARN' },
      teacher: { emoji: '👩‍🏫', label: '교사', cls: 'INFO' },
      student: { emoji: '🎒', label: '학생', cls: 'DEBUG' }
    };

    let _nameMap = {};
    const _isAdmin = () => isAdminLevel(session);

    function renderUsers() {
      const list = currentFilter === 'all' ? allUsers : allUsers.filter(u => userMatchesFilter(u, currentFilter));
      const tbody = document.getElementById('userList');
      document.getElementById('tableTitle').textContent = `사용자 목록 (${list.length}명)`;

      if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="9" class="empty-state">등록된 사용자가 없습니다.</td></tr>'; return; }

      _nameMap = resolveDisplayNames(allUsers);
      const myRank = session.permissionRank || 0;
      const showId = _isAdmin();
      tbody.innerHTML = list.map(u => {
        const perm = u.permission_level;
        const typeLabel = TYPE_LABELS[u.user_type] || u.user_type;
        const typeEmoji = u.user_type === 'student' ? '🎒' : '👩‍🏫';
        const permLabel = PERMISSION_LABELS[perm] || perm;
        const permEmoji = PERMISSION_EMOJI[perm] || '';
        const dn = _nameMap[u.id] || u.display_name || '-';
        const lastLogin = u.last_sign_in_at ? formatKSTShort(u.last_sign_in_at) : '<span style="color:#adb5bd;font-size:0.8rem;">없음</span>';
        const targetRank = getPermRank(perm);
        const isSuperAdmin = u.is_super_admin || false;
        const canManage = u.id === session.id || (myRank >= targetRank && (!isSuperAdmin || session.isSuperAdmin));
        const rb = ROLE_BADGES[badgeKeyForUser(u)] || ROLE_BADGES.student;
        return `<tr>
          <td><span class="level-badge ${u.user_type === 'student' ? 'DEBUG' : 'INFO'}">${typeEmoji} ${typeLabel}</span></td>
          <td><span class="level-badge ${rb.cls}">${permEmoji} ${permLabel}</span></td>
          <td>${dn}${showId ? ' <span style="font-size:0.72rem;color:#868e96;">(' + u.username + ')</span>' : ''}</td>
          <td>${getDeptName(u.department_id)}</td>
          <td>${getClassLabel(u.class_number)}</td>
          <td style="font-weight:700;">${u.talent_balance || 0}</td>
          <td>${formatKSTShort(u.created_at)}</td>
          <td>${lastLogin}</td>
          <td>
            ${canManage ? `<button class="filter-btn" onclick='openEditModal(${JSON.stringify(u).replace(/'/g,"&#39;")})'>수정</button>` : ''}
            ${canManage && u.id !== session.id ? `<button class="filter-btn" onclick="resetPw('${u.id}','${_nameMap[u.id]||u.display_name}')">비밀번호초기화</button>` : ''}
            ${canManage && u.id !== session.id && !isSuperAdmin ? `<button class="btn-ack" onclick="confirmDelete('${u.id}','${_nameMap[u.id]||u.display_name}')">삭제</button>` : ''}
          </td>
        </tr>`;
      }).join('');
    }

    const MGMT_LEVELS = ['dept_teacher','chief','evangelist','admin'];

    function onUserTypeChange() {
      const ut = document.getElementById('mUserType').value;
      const permWrap = document.getElementById('permLevelWrap');
      if (ut === 'student') {
        permWrap.style.display = 'none';
      } else {
        permWrap.style.display = 'block';
        document.getElementById('mPermLevel').innerHTML = buildPermOptions(session.permissionRank || 0, 'teacher');
      }
      onPermLevelChange();
    }

    function onPermLevelChange() {
      const ut = document.getElementById('mUserType').value;
      const perm = ut === 'student' ? 'student' : (document.getElementById('mPermLevel').value || 'teacher');
      document.getElementById('managedDeptWrap').style.display = MGMT_LEVELS.includes(perm) ? 'block' : 'none';
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '사용자 등록';
      document.getElementById('usernameWrap').style.display = _isAdmin() ? 'block' : 'none';
      document.getElementById('mUsername').value = '';
      document.getElementById('mUsername').disabled = false;
      document.getElementById('mDisplayName').value = '';
      document.getElementById('mUserType').value = 'student';
      document.getElementById('permLevelWrap').style.display = 'none';
      document.getElementById('mDept').value = '';
      document.getElementById('mClassNumber').value = '';
      document.getElementById('classWrap').style.display = 'none';
      document.getElementById('mManagedDept').value = '';
      document.getElementById('managedDeptWrap').style.display = 'none';
      document.getElementById('passwordWrap').style.display = 'block';
      document.getElementById('mPassword').value = '1234';
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('userModal').classList.remove('hidden');
    }

    function openEditModal(u) {
      editingId = u.id;
      document.getElementById('modalTitle').textContent = '사용자 수정';
      document.getElementById('usernameWrap').style.display = _isAdmin() ? 'block' : 'none';
      document.getElementById('mUsername').value = u.username;
      document.getElementById('mUsername').disabled = true;
      document.getElementById('mDisplayName').value = u.display_name || '';
      document.getElementById('mUserType').value = u.user_type || 'student';
      if (u.user_type === 'teacher') {
        document.getElementById('permLevelWrap').style.display = 'block';
        document.getElementById('mPermLevel').innerHTML = buildPermOptions(session.permissionRank || 0, u.permission_level || 'teacher');
      } else {
        document.getElementById('permLevelWrap').style.display = 'none';
      }
      document.getElementById('mDept').value = u.department_id || '';
      onDeptChange();
      document.getElementById('mClassNumber').value = u.class_number || '';
      document.getElementById('mManagedDept').value = u.managed_dept_id || '';
      document.getElementById('managedDeptWrap').style.display = MGMT_LEVELS.includes(u.permission_level) ? 'block' : 'none';
      document.getElementById('passwordWrap').style.display = 'none';
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('userModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('userModal').classList.add('hidden'); }

    async function saveUser() {
      const errEl = document.getElementById('modalError');
      let username = document.getElementById('mUsername').value.trim();
      const displayName = document.getElementById('mDisplayName').value.trim();
      const userType = document.getElementById('mUserType').value;
      const permLevel = userType === 'student' ? 'student' : (document.getElementById('mPermLevel').value || 'teacher');
      const deptId = document.getElementById('mDept').value || null;
      const classNumber = document.getElementById('mClassNumber').value ? parseInt(document.getElementById('mClassNumber').value) : null;
      const managedDeptId = document.getElementById('mManagedDept').value || null;
      const needsManagedDept = MGMT_LEVELS.includes(permLevel);

      if (!displayName) { errEl.textContent = '이름을 입력해주세요.'; errEl.classList.add('show'); return; }
      if (!editingId && username && !/^[a-zA-Z0-9_-]+$/.test(username)) { errEl.textContent = '아이디는 영문, 숫자, _, - 만 사용 가능합니다.'; errEl.classList.add('show'); return; }
      if (!editingId && !username) username = 'user_' + Date.now().toString(36);
      if (_isAdmin() && !editingId && !username) { errEl.textContent = '아이디를 입력해주세요.'; errEl.classList.add('show'); return; }
      if (!deptId) { errEl.textContent = '소속 부서를 선택해주세요.'; errEl.classList.add('show'); return; }
      if (needsManagedDept && !managedDeptId) { errEl.textContent = '담당 관리 부서를 선택해주세요.'; errEl.classList.add('show'); return; }

      if (editingId) {
        const { error } = await updateUser(editingId, { displayName, userType, permissionLevel: permLevel, departmentId: deptId, managedDeptId: needsManagedDept ? managedDeptId : null, classNumber });
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      } else {
        const pw = document.getElementById('mPassword').value || '1234';
        const { error } = await createUser({ username, password: pw, displayName: displayName || username, userType, permissionLevel: permLevel, departmentId: deptId, managedDeptId: needsManagedDept ? managedDeptId : null, classNumber });
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      }
      closeModal();
      await loadData();
    }

    async function resetPw(id, username) {
      if (!confirm(`"${username}" 비밀번호를 초기화(1234)하시겠습니까?`)) return;
      const { error } = await resetUserPassword(id, username);
      if (error) alert('초기화 실패: ' + error);
      else alert('비밀번호가 1234로 초기화되었습니다.');
    }

    async function confirmDelete(id, username) {
      if (!confirm(`"${username}" 사용자를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;
      const { error } = await deleteUser(id);
      if (error) alert('삭제 실패: ' + error);
      else await loadData();
    }

    function renderRequests() {
      document.getElementById('reqTitle').textContent = `📝 가입 신청 내역 (${allRequests.length}건)`;
      if (allRequests.length === 0) {
        document.getElementById('reqList').innerHTML = '<tr><td colspan="7" class="empty-state">대기 중인 가입 신청이 없습니다.</td></tr>';
        return;
      }
      const tbody = document.getElementById('reqList');
      tbody.innerHTML = allRequests.map(r => {
        const rb = ROLE_BADGES[badgeKeyForUser({ permission_level: r.permission_level || 'student', user_type: r.user_type })] || ROLE_BADGES.student;
        return `<tr>
          <td><span class="level-badge ${rb.cls}">${rb.emoji} ${rb.label}</span></td>
          <td>${r.display_name}</td>
          <td>${getDeptName(r.department_id)}</td>
          <td style="font-size:0.8rem;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.reason || ''}">${r.reason || '-'}</td>
          <td>${formatKSTShort(r.created_at)}</td>
          <td>
            <select id="reqType_${r.id}" style="padding:0.3rem;border-radius:6px;border:1px solid var(--admin-border);font-size:0.8rem;margin-bottom:0.3rem;" onchange="onReqTypeChange('${r.id}')">
              <option value="student">🎒 학생</option>
              <option value="teacher">👩‍🏫 교사</option>
            </select>
            <select id="reqPerm_${r.id}" style="padding:0.3rem;border-radius:6px;border:1px solid var(--admin-border);font-size:0.8rem;margin-bottom:0.3rem;display:none;">
              ${buildPermOptions(session.permissionRank || 0, 'teacher')}
            </select>
            <div id="reqManagedWrap_${r.id}" style="display:none;margin:0.3rem 0;">
              <select id="reqManaged_${r.id}" style="padding:0.3rem;border-radius:6px;border:1px solid var(--admin-border);font-size:0.8rem;width:100%;">
                <option value="">담당 부서 선택</option>
                ${allDepts.map(d => '<option value="' + d.id + '">' + d.name + '</option>').join('')}
              </select>
            </div>
            <button class="filter-btn" style="background:#51cf66;color:#fff;" onclick="approveReq('${r.id}','${r.username}','${r.display_name}','${r.department_id || ''}')">승인</button>
            <button class="btn-ack" onclick="rejectReq('${r.id}','${r.username}')">거부</button>
          </td>
        </tr>`;
      }).join('');
    }

    function onReqTypeChange(reqId) {
      const ut = document.getElementById('reqType_' + reqId).value;
      const permEl = document.getElementById('reqPerm_' + reqId);
      permEl.style.display = ut === 'teacher' ? 'inline-block' : 'none';
      const perm = ut === 'student' ? 'student' : permEl.value;
      const wrap = document.getElementById('reqManagedWrap_' + reqId);
      wrap.style.display = MGMT_LEVELS.includes(perm) ? 'block' : 'none';
    }

    async function approveReq(reqId, username, displayName, deptId) {
      const userType = document.getElementById('reqType_' + reqId).value;
      const permLevel = userType === 'student' ? 'student' : (document.getElementById('reqPerm_' + reqId).value || 'teacher');
      const managedEl = document.getElementById('reqManaged_' + reqId);
      const needsManagedDept = MGMT_LEVELS.includes(permLevel);
      const managedDeptId = (needsManagedDept && managedEl) ? managedEl.value || null : null;
      const permLabel = PERMISSION_LABELS[permLevel] || permLevel;
      if (!confirm(`"${username}" (${displayName})을(를) [${permLabel}] 역할로 승인하시겠습니까?`)) return;
      const { error } = await createUser({ username, password: '1234', displayName, userType, permissionLevel: permLevel, departmentId: deptId || null, managedDeptId });
      if (error) { alert('계정 생성 실패: ' + error); return; }
      await _sb.from('registration_requests').update({
        status: 'approved', reviewed_by: session.username, review_note: '승인됨', reviewed_at: new Date().toISOString()
      }).eq('id', reqId);
      await logInfo('REGISTER_APPROVE', { username, permissionLevel: permLevel });
      await loadData();
    }

    async function rejectReq(reqId, username) {
      const note = prompt(`"${username}" 가입 거부 사유를 입력해주세요:`, '');
      if (note === null) return;
      await _sb.from('registration_requests').update({
        status: 'rejected', reviewed_by: session.username, review_note: note || '거부됨', reviewed_at: new Date().toISOString()
      }).eq('id', reqId);
      await logInfo('REGISTER_REJECT', { username, reason: note });
      await loadData();
    }

    document.getElementById('mUsername').addEventListener('input', function() {
      this.value = this.value.replace(/[^a-zA-Z0-9_\-]/g, '');
    });

    document.getElementById('userModal').addEventListener('click', e => { if(e.target.classList.contains('modal-overlay')) closeModal(); });
  </script>
</body>
</html>
