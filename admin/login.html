<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 로그인 - CHO Talents</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-title">관리자 로그인</div>
      <p class="login-sub">CHO-Talents 관리 시스템</p>

      <div class="form-error" id="errorMsg"></div>

      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <label for="username">아이디</label>
          <input type="text" id="username" placeholder="아이디 입력" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호 입력" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" id="btnLogin">로그인</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/activity-log.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    initSupabase();

    const existing = getSession();
    if (existing && !existing.isFirstLogin) {
      window.location.href = 'index.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async () => {
      const btn = document.getElementById('btnLogin');
      const errEl = document.getElementById('errorMsg');
      errEl.classList.remove('show');
      btn.disabled = true;
      btn.textContent = '로그인 중...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const result = await login(username, password);

      if (result.success) {
        if (result.data.is_first_login) {
          window.location.href = 'change-password.html';
        } else {
          window.location.href = 'index.html';
        }
      } else {
        errEl.textContent = result.error;
        errEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = '로그인';
      }
    });
  </script>
  <script src="../js/version.js"></script>
</body>
</html>
