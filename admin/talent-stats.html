  <div class="admin-container" style="max-width:100%;padding:1rem 1.5rem;">

    <div class="filters" style="margin-bottom:0.8rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">

    <div class="filters" style="margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;">
      <button class="filter-btn preset-btn active" data-preset="all" onclick="setPreset('all')">?꾩껜 湲곌컙</button>
      <button class="filter-btn preset-btn" data-preset="week" onclick="setPreset('week')">?대쾲 二?/button>
      <button class="filter-btn preset-btn" data-preset="month" onclick="setPreset('month')">?대쾲 ??/button>
      <button class="filter-btn preset-btn" data-preset="semester" onclick="setPreset('semester')">?대쾲 ?숆린</button>
      <span style="color:#868e96;font-size:0.82rem;margin-left:0.3rem;">|</span>
      <input type="date" id="dateFrom" style="padding:0.35rem 0.5rem;border:1px solid var(--admin-border);border-radius:8px;font-size:0.82rem;" onchange="setPreset('custom')" />
      <span style="font-size:0.82rem;color:#868e96;">~</span>
      <input type="date" id="dateTo" style="padding:0.35rem 0.5rem;border:1px solid var(--admin-border);border-radius:8px;font-size:0.82rem;" onchange="setPreset('custom')" />

    <div id="summaryCards" style="margin-bottom:1.2rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0.8rem;"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=3.13.0"></script>
  <script src="../js/activity-log.js?v=3.13.0"></script>
  <script src="../js/auth.js?v=3.13.0"></script>
  <script>
    initSupabase();
    let session, allTxns = [], allProfiles = [], allDepts = [];
    let currentView = 'all';
    let currentPreset = 'all';

    (async () => {
      session = await initPage(60, '../login.html');
      renderRoleBadge('navUser', session, '../');
      applyPermNav(session.permissionRank || 0);
      autoLogPageView();
      updatePendingBadge();
      updateNavOrderBadge();
      await loadData();
      loadStats();
    })();

    async function loadData() {
      const [txnRes, profRes, deptRes] = await Promise.all([
        _sb.from('talent_transactions').select('user_id, amount, description, talent_item_id, created_at').eq('type', 'earn'),
        _sb.from('profiles').select('id, display_name, username, user_type, department_id, class_number'),
        _sb.from('departments').select('id, name')
      ]);
      allTxns = txnRes.data || [];
      allProfiles = profRes.data || [];
      allDepts = deptRes.data || [];

      const sel = document.getElementById('deptFilter');
      sel.innerHTML = '<option value="">?꾩껜 遺??/option>' + allDepts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    }

    function switchView(view) {
      currentView = view;
      ['All', 'Dept', 'Class'].forEach(v => document.getElementById('view' + v).classList.toggle('active', v.toLowerCase() === view));
      document.getElementById('deptFilter').style.display = (view === 'dept' || view === 'class') ? '' : 'none';
      loadStats();
    }

    function setPreset(preset) {
      currentPreset = preset;
      document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.dataset.preset === preset));
      const now = new Date();
      const fromEl = document.getElementById('dateFrom');
      const toEl = document.getElementById('dateTo');

      if (preset === 'all') {
        fromEl.value = ''; toEl.value = '';
      } else if (preset === 'week') {
        const d = new Date(now); d.setDate(d.getDate() - d.getDay());
        fromEl.value = fmtDate(d); toEl.value = fmtDate(now);
      } else if (preset === 'month') {
        fromEl.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
        toEl.value = fmtDate(now);
      } else if (preset === 'semester') {
        const sMonth = now.getMonth() < 6 ? 1 : 7;
        fromEl.value = `${now.getFullYear()}-${String(sMonth).padStart(2,'0')}-01`;
        toEl.value = fmtDate(now);
      }
      loadStats();
    }

    function fmtDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function getFilteredTxns() {
      const deptId = document.getElementById('deptFilter').value;
      let txns = [...allTxns];
      let profiles = [...allProfiles];

      if (deptId) {
        const userIds = new Set(profiles.filter(p => p.department_id === deptId).map(p => p.id));
        txns = txns.filter(t => userIds.has(t.user_id));
        profiles = profiles.filter(p => userIds.has(p.id));
      }

      const dateFrom = document.getElementById('dateFrom').value;
      const dateTo = document.getElementById('dateTo').value;
      if (dateFrom) {
        const from = new Date(dateFrom + 'T00:00:00');
        txns = txns.filter(t => new Date(t.created_at) >= from);
      }
      if (dateTo) {
        const to = new Date(dateTo + 'T23:59:59');
        txns = txns.filter(t => new Date(t.created_at) <= to);
      }

      return { txns, profiles };
    }

    function loadStats() {
      const { txns, profiles } = getFilteredTxns();
      renderSummaryCards(txns, profiles);

      if (currentView === 'all') renderOverallStats(txns, profiles);
      else if (currentView === 'dept') renderDeptStats(txns, profiles);
      else if (currentView === 'class') renderClassStats(txns, profiles);
    }

    function renderSummaryCards(txns, profiles) {
      const total = txns.reduce((s, t) => s + (t.amount || 0), 0);
      const userIds = new Set(txns.map(t => t.user_id));
      const items = new Set(txns.map(t => t.description || '湲고?'));
      const profMap = {};
      profiles.forEach(p => { profMap[p.id] = p; });
      let studentAmt = 0, teacherAmt = 0, studentCnt = 0, teacherCnt = 0;
      txns.forEach(t => {
        const p = profMap[t.user_id];
        if (p && p.user_type === 'student') { studentAmt += t.amount || 0; studentCnt++; }
        else { teacherAmt += t.amount || 0; teacherCnt++; }
      });

      document.getElementById('summaryCards').innerHTML = `
        <div style="background:#f8f9fa;border-radius:12px;padding:1rem;text-align:center;">
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">珥??곷┰</div>
          <div style="font-size:1.5rem;font-weight:800;color:#2b8a3e;">${fmtNum(total)}</div>
        </div>
        <div style="background:#f8f9fa;border-radius:12px;padding:1rem;text-align:center;">
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">珥?嫄곕옒 ??/div>
          <div style="font-size:1.5rem;font-weight:800;color:#1971c2;">${fmtNum(txns.length)}</div>
        </div>
        <div style="background:#f8f9fa;border-radius:12px;padding:1rem;text-align:center;">
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">??ぉ ??/div>
          <div style="font-size:1.5rem;font-weight:800;color:#e67700;">${items.size}</div>
        </div>
        <div style="background:#e6fcf5;border-radius:12px;padding:1rem;text-align:center;">
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">?럲 ?숈깮</div>
          <div style="font-size:1.2rem;font-weight:800;color:#2b8a3e;">${fmtNum(studentAmt)}</div>
          <div style="font-size:0.75rem;color:#868e96;">${fmtNum(studentCnt)}嫄?/div>
        </div>
        <div style="background:#e7f5ff;border-radius:12px;padding:1rem;text-align:center;">
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">?뫆?랅윆?援먯궗</div>
          <div style="font-size:1.2rem;font-weight:800;color:#1971c2;">${fmtNum(teacherAmt)}</div>
          <div style="font-size:0.75rem;color:#868e96;">${fmtNum(teacherCnt)}嫄?/div>
        </div>`;
    }

    function renderOverallStats(txns, profiles) {
      if (txns.length === 0) {
        document.getElementById('statsContent').innerHTML = '<div class="empty-state"><div class="empty-state-icon">?뱤</div><p>?곷┰ ?곗씠?곌? ?놁뒿?덈떎.</p></div>';
        return;
      }

      const profMap = {};
      profiles.forEach(p => { profMap[p.id] = p; });
      const total = txns.reduce((s, t) => s + (t.amount || 0), 0);
      const byItem = {};
      txns.forEach(t => {
        const key = t.description || '湲고?';
        if (!byItem[key]) byItem[key] = { amount: 0, count: 0, studentAmt: 0, teacherAmt: 0, studentCnt: 0, teacherCnt: 0 };
        byItem[key].amount += t.amount || 0;
        byItem[key].count++;
        const p = profMap[t.user_id];
        if (p && p.user_type === 'student') { byItem[key].studentAmt += t.amount || 0; byItem[key].studentCnt++; }
        else { byItem[key].teacherAmt += t.amount || 0; byItem[key].teacherCnt++; }
      });
      const sorted = Object.entries(byItem).sort((a, b) => b[1].amount - a[1].amount);

      let html = `<div class="data-table-wrap"><div class="data-table-header"><div class="data-table-title">??ぉ蹂??곷┰ ?듦퀎</div></div>
        <table class="data-table"><thead><tr><th>??ぉ</th><th>珥??щ???/th><th>?럲 ?숈깮</th><th>?뫆?랅윆?援먯궗</th><th>嫄곕옒 ??/th><th>鍮꾩쑉</th><th>洹몃옒??/th></tr></thead><tbody>`;
      sorted.forEach(([name, v]) => {
        const pct = total > 0 ? ((v.amount / total) * 100).toFixed(1) : 0;
        html += `<tr><td style="font-weight:600;">${name}</td><td>${fmtNum(v.amount)}</td>
          <td>${fmtNum(v.studentAmt)} <span style="font-size:0.72rem;color:#868e96;">(${v.studentCnt})</span></td>
          <td>${fmtNum(v.teacherAmt)} <span style="font-size:0.72rem;color:#868e96;">(${v.teacherCnt})</span></td>
          <td>${fmtNum(v.count)}</td><td>${pct}%</td>
          <td><div style="background:#e9ecef;border-radius:4px;height:18px;width:100%;"><div style="background:#51cf66;height:100%;border-radius:4px;width:${pct}%;"></div></div></td></tr>`;
      });
      html += '</tbody></table></div>';
      document.getElementById('statsContent').innerHTML = html;
    }

    function renderDeptStats(txns, profiles) {
      const profMap = {};
      profiles.forEach(p => { profMap[p.id] = p; });
      const deptMap = {};
      allDepts.forEach(d => { deptMap[d.id] = d.name; });

      const byDept = {};
      txns.forEach(t => {
        const prof = profMap[t.user_id];
        const dName = prof && prof.department_id ? (deptMap[prof.department_id] || '誘몃같??) : '誘몃같??;
        if (!byDept[dName]) byDept[dName] = { amount: 0, count: 0, users: new Set(), studentAmt: 0, teacherAmt: 0, students: new Set(), teachers: new Set() };
        byDept[dName].amount += t.amount || 0;
        byDept[dName].count++;
        byDept[dName].users.add(t.user_id);
        if (prof && prof.user_type === 'student') { byDept[dName].studentAmt += t.amount || 0; byDept[dName].students.add(t.user_id); }
        else { byDept[dName].teacherAmt += t.amount || 0; byDept[dName].teachers.add(t.user_id); }
      });
      const sorted = Object.entries(byDept).sort((a, b) => b[1].amount - a[1].amount);
      const total = txns.reduce((s, t) => s + (t.amount || 0), 0);

      let html = `<div class="data-table-wrap"><div class="data-table-header"><div class="data-table-title">遺?쒕퀎 ?곷┰ ?듦퀎</div></div>
        <table class="data-table"><thead><tr><th>遺??/th><th>珥??щ???/th><th>?럲 ?숈깮</th><th>?뫆?랅윆?援먯궗</th><th>嫄곕옒 ??/th><th>?몄썝</th><th>1???됯퇏</th><th>鍮꾩쑉</th></tr></thead><tbody>`;
      sorted.forEach(([name, v]) => {
        const pct = total > 0 ? ((v.amount / total) * 100).toFixed(1) : 0;
        const avg = v.users.size > 0 ? Math.round(v.amount / v.users.size) : 0;
        html += `<tr><td style="font-weight:600;">${name}</td><td>${fmtNum(v.amount)}</td>
          <td>${fmtNum(v.studentAmt)} <span style="font-size:0.72rem;color:#868e96;">(${v.students.size}紐?</span></td>
          <td>${fmtNum(v.teacherAmt)} <span style="font-size:0.72rem;color:#868e96;">(${v.teachers.size}紐?</span></td>
          <td>${fmtNum(v.count)}</td><td>${v.users.size}</td><td>${fmtNum(avg)}</td><td>${pct}%</td></tr>`;
      });
      html += '</tbody></table></div>';
      document.getElementById('statsContent').innerHTML = html;
    }

    function renderClassStats(txns, profiles) {
      const profMap = {};
      profiles.forEach(p => { profMap[p.id] = p; });
      const deptMap = {};
      allDepts.forEach(d => { deptMap[d.id] = d.name; });

      const byUser = {};
      txns.forEach(t => {
        const prof = profMap[t.user_id];
        if (!prof) return;
        const dName = prof.department_id ? (deptMap[prof.department_id] || '誘몃같??) : '誘몃같??;
        const uName = prof.display_name || prof.username || '-';
        const key = prof.id;
        if (!byUser[key]) byUser[key] = { dept: dName, name: uName, userType: prof.user_type, amount: 0, count: 0, items: {} };
        byUser[key].amount += t.amount || 0;
        byUser[key].count++;
        const desc = t.description || '湲고?';
        byUser[key].items[desc] = (byUser[key].items[desc] || 0) + (t.amount || 0);
      });
      const sorted = Object.values(byUser).sort((a, b) => b.amount - a.amount);

      let html = `<div class="data-table-wrap"><div class="data-table-header"><div class="data-table-title">媛쒖씤蹂??곷┰ ?듦퀎 (${sorted.length}紐?</div></div>
        <table class="data-table"><thead><tr><th>遺??/th><th>?대쫫</th><th>?좏삎</th><th>珥??щ???/th><th>嫄곕옒 ??/th><th>?곸쐞 ??ぉ</th></tr></thead><tbody>`;
      sorted.forEach(u => {
        const typeBadge = u.userType === 'student'
          ? '<span style="display:inline-block;padding:0.1rem 0.4rem;border-radius:4px;font-size:0.72rem;background:#e6fcf5;color:#2b8a3e;">?럲 ?숈깮</span>'
          : '<span style="display:inline-block;padding:0.1rem 0.4rem;border-radius:4px;font-size:0.72rem;background:#e7f5ff;color:#1971c2;">?뫆?랅윆?援먯궗</span>';
        const topItems = Object.entries(u.items).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, v]) => `${n}(${fmtNum(v)})`).join(', ');
        html += `<tr><td>${u.dept}</td><td style="font-weight:600;">${u.name}</td><td>${typeBadge}</td><td>${fmtNum(u.amount)}</td><td>${fmtNum(u.count)}</td><td style="font-size:0.8rem;">${topItems}</td></tr>`;
      });
      html += '</tbody></table></div>';
      document.getElementById('statsContent').innerHTML = html;
    }
  </script>
