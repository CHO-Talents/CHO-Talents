  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">🛒 구매 관리</h2>

    <div class="filters" style="margin-bottom:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
      <button class="filter-btn active" id="tabAll" onclick="switchPurchaseTab('all')">📊 전체</button>
      <button class="filter-btn" id="tabRequested" onclick="switchPurchaseTab('requested')">📋 구매 신청</button>
      <button class="filter-btn" id="tabPreparing" onclick="switchPurchaseTab('preparing')">📦 상품 준비</button>
      <button class="filter-btn" id="tabPurchased" onclick="switchPurchaseTab('purchased')">💳 상품 구매</button>
      <button class="filter-btn" id="tabDelivered" onclick="switchPurchaseTab('delivered')">✅ 상품 지급</button>
    </div>

    <div id="statusFilterWrap" style="margin-bottom:0.8rem;">
      <select id="statusFilter" onchange="renderOrders()" style="padding:0.4rem 0.8rem;border:1px solid var(--admin-border);border-radius:8px;font-size:0.85rem;">
        <option value="">전체 상태</option>
        <option value="requested">📋 구매 신청</option>
        <option value="preparing">📦 상품 준비</option>
        <option value="purchased">💳 상품 구매</option>
        <option value="delivered">✅ 상품 지급</option>
      </select>
    </div>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title" id="tableTitle">전체 목록</div>
        <div id="bulkActions" style="display:none;">
          <button class="btn-confirm" id="btnBulkDeliver" onclick="bulkDeliver()" style="padding:0.4rem 1rem;font-size:0.85rem;">✅ 선택 지급 완료</button>
        </div>
      </div>
      <table class="admin-table">
        <thead>
          <tr id="tableHead"></tr>
        </thead>
        <tbody id="orderList"><tr><td colspan="7" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=3.13.1"></script>
  <script src="../js/activity-log.js?v=3.13.1"></script>
  <script src="../js/auth.js?v=3.13.1"></script>
  <script src="../js/user-mgmt.js?v=3.13.1"></script>
  <script>
    initSupabase();
    let session;
    let currentPTab = 'all';
    let allOrders = [];
    let profileMap = {};
    let processorMap = {};

    const STATUS_LABEL = { requested:'구매 신청', preparing:'상품 준비', purchased:'상품 구매', delivered:'상품 지급' };
    const STATUS_COLOR = { requested:'#868e96', preparing:'#e67700', purchased:'#1971c2', delivered:'#2b8a3e' };
    const TAB_IDS = ['all','requested','preparing','purchased','delivered'];

    (async () => {
      session = await initPage(60, '../login.html');
      if (!session) return;
      applyPermNav(session.permissionRank || 0);
      renderRoleBadge('navUser', session, '../');
      autoLogPageView();
      updatePendingBadge();
      updateNavOrderBadge();
      await loadOrders();
    })();

    function switchPurchaseTab(tab) {
      currentPTab = tab;
      TAB_IDS.forEach(t => {
        const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
        if (el) el.classList.toggle('active', t === tab);
      });
      document.getElementById('statusFilterWrap').style.display = tab === 'all' ? '' : 'none';
      renderOrders();
    }

    async function loadOrders() {
      const { data, error } = await _sb.from('product_orders').select('*').order('created_at', { ascending: false });
      if (error) {
        logError('PURCHASE_LOAD_FAIL', { error: error.message });
        document.getElementById('orderList').innerHTML = '<tr><td colspan="7" class="empty-state">데이터 조회 실패</td></tr>';
        return;
      }
      allOrders = data || [];

      const userIds = [...new Set(allOrders.map(o => o.user_id))];
      const procIds = [...new Set(allOrders.flatMap(o => [o.prepared_by, o.purchased_by, o.delivered_by].filter(Boolean)))];
      const allIds = [...new Set([...userIds, ...procIds])];

      if (allIds.length > 0) {
        const { data: profiles } = await _sb.from('profiles').select('id,display_name,username,department_id').in('id', allIds);
        profileMap = {};
        processorMap = {};
        (profiles || []).forEach(p => {
          profileMap[p.id] = p;
          processorMap[p.id] = p.display_name || p.username || '-';
        });
      }

      const deptRes = await _sb.from('departments').select('id,name');
      const deptMap = {};
      (deptRes.data || []).forEach(d => { deptMap[d.id] = d.name; });
      allOrders.forEach(o => {
        const prof = profileMap[o.user_id];
        o._userName = prof ? (prof.display_name || prof.username) : '-';
        o._deptId = prof ? prof.department_id : null;
        o._deptName = prof && prof.department_id ? (deptMap[prof.department_id] || '-') : '-';
      });

      renderOrders();
      updateOrderBadge();
    }

    function getVisibleOrders() {
      let orders;
      if (currentPTab === 'all') {
        const filterVal = document.getElementById('statusFilter').value;
        orders = filterVal ? allOrders.filter(o => o.status === filterVal) : [...allOrders];
      } else {
        orders = allOrders.filter(o => o.status === currentPTab);
      }
      return orders;
    }

    function canProcessOrder(order) {
      const myRank = session.permissionRank || 0;
      if (order.status === 'delivered') return false;
      if (myRank >= 90) return true;
      if (myRank >= 60 && session.managedDeptId && order._deptId === session.managedDeptId) return true;
      return false;
    }

    function getProcessorInfo(order, stage) {
      let byField, atField, label;
      if (stage === 'preparing') {
        byField = order.prepared_by; atField = order.prepared_at; label = '준비';
      } else if (stage === 'purchased') {
        byField = order.purchased_by; atField = order.purchased_at; label = '구매';
      } else if (stage === 'delivered') {
        byField = order.delivered_by; atField = order.delivered_at; label = '지급';
      }
      if (!byField) return '';
      const name = processorMap[byField] || '-';
      const time = atField ? formatKSTShort(atField) : '-';
      return `<div style="font-size:0.75rem;color:#636e72;">${label}: ${name}<br>${time}</div>`;
    }

    function renderOrders() {
      const orders = getVisibleOrders();
      const tbody = document.getElementById('orderList');
      const title = document.getElementById('tableTitle');
      const isAllTab = currentPTab === 'all';
      const tabLabel = isAllTab ? '전체' : STATUS_LABEL[currentPTab];
      title.textContent = `${tabLabel} 목록 (${orders.length}건)`;

      const myRank = session.permissionRank || 0;
      const showBulk = currentPTab === 'purchased' && myRank >= 60;
      document.getElementById('bulkActions').style.display = showBulk ? '' : 'none';

      let headCols = '';
      if (showBulk) headCols += '<th style="width:30px;"><input type="checkbox" onchange="toggleAllOrders(this)"></th>';
      if (isAllTab) headCols += '<th>상태</th>';
      headCols += '<th>신청일</th><th>상품명</th><th>가격</th><th>신청자</th><th>부서</th>';

      if (currentPTab === 'preparing' || (isAllTab)) headCols += '<th>이전 처리</th>';
      else if (currentPTab === 'purchased') headCols += '<th>준비 처리</th>';
      else if (currentPTab === 'delivered') headCols += '<th>구매 처리</th>';

      headCols += '<th>관리</th>';
      document.getElementById('tableHead').innerHTML = headCols;

      const colCount = document.getElementById('tableHead').children.length;
      if (orders.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="empty-state">해당 상태의 주문이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => {
        const canProc = canProcessOrder(o);
        let actionBtn = '';
        if (o.status === 'requested' && canProc) {
          actionBtn = `<button class="filter-btn" style="font-size:0.78rem;padding:0.3rem 0.6rem;" onclick="updateStatus('${o.id}','preparing')">상품 준비</button>`;
        } else if (o.status === 'preparing' && canProc) {
          actionBtn = `<button class="filter-btn" style="font-size:0.78rem;padding:0.3rem 0.6rem;background:#1971c2;color:#fff;border-color:#1971c2;" onclick="confirmPurchase('${o.id}')">구매 확정</button>`;
        } else if (o.status === 'purchased' && canProc) {
          actionBtn = `<button class="filter-btn" style="font-size:0.78rem;padding:0.3rem 0.6rem;background:#2b8a3e;color:#fff;border-color:#2b8a3e;" onclick="updateStatus('${o.id}','delivered')">지급 완료</button>`;
        }

        let procInfo = '';
        if (isAllTab) {
          const infos = [getProcessorInfo(o, 'preparing'), getProcessorInfo(o, 'purchased'), getProcessorInfo(o, 'delivered')].filter(Boolean).join('');
          procInfo = infos || '<span style="font-size:0.75rem;color:#adb5bd;">-</span>';
        } else if (currentPTab === 'preparing') {
          procInfo = '-';
        } else if (currentPTab === 'purchased') {
          procInfo = getProcessorInfo(o, 'preparing') || '-';
        } else if (currentPTab === 'delivered') {
          procInfo = getProcessorInfo(o, 'purchased') || '-';
        }

        const chkTd = showBulk && o.status === 'purchased' ? `<td><input type="checkbox" class="order-chk" value="${o.id}"></td>` : (showBulk ? '<td></td>' : '');
        const statusBadge = `<span style="padding:0.15rem 0.5rem;border-radius:4px;font-size:0.78rem;background:${STATUS_COLOR[o.status]}22;color:${STATUS_COLOR[o.status]};font-weight:600;">${STATUS_LABEL[o.status]}</span>`;

        let row = '<tr>';
        row += chkTd;
        if (isAllTab) row += `<td>${statusBadge}</td>`;
        row += `<td style="font-size:0.8rem;">${formatKSTShort(o.requested_at || o.created_at)}</td>`;
        row += `<td>${o.product_name}</td>`;
        row += `<td>${o.price}</td>`;
        row += `<td>${o._userName}</td>`;
        row += `<td>${o._deptName}</td>`;
        if (currentPTab !== 'requested') row += `<td>${procInfo}</td>`;
        else if (isAllTab) row += `<td>${procInfo}</td>`;
        row += `<td>${actionBtn}</td>`;
        row += '</tr>';
        return row;
      }).join('');
    }

    async function updateStatus(orderId, newStatus) {
      try {
        const updateFields = { status: newStatus };
        if (newStatus === 'preparing') { updateFields.prepared_at = new Date().toISOString(); updateFields.prepared_by = session.id; }
        if (newStatus === 'delivered') { updateFields.delivered_at = new Date().toISOString(); updateFields.delivered_by = session.id; }

        const { error } = await _sb.from('product_orders').update(updateFields).eq('id', orderId);
        if (error) {
          await logError('ORDER_STATUS_CHANGE_FAIL', { orderId, newStatus, error: error.message });
          alert('상태 변경 실패: ' + tErr(error.message));
          return;
        }
        await logInfo('ORDER_STATUS_CHANGE', { orderId, newStatus });
        await loadOrders();
      } catch (err) {
        await logError('ORDER_STATUS_CHANGE_ERROR', { orderId, newStatus, error: String(err) });
        alert('상태 변경 중 오류: ' + tErr(err.message));
      }
    }

    async function confirmPurchase(orderId) {
      if (!confirm('상품 구매를 확정하시겠습니까?\n달란트가 실제 차감됩니다.')) return;
      try {
        const { data, error } = await _sb.rpc('confirm_product_purchase', {
          p_order_id: orderId,
          p_admin_id: session.id
        });
        if (error) {
          await logError('ORDER_PURCHASE_CONFIRM_FAIL', { orderId, error: error.message });
          alert('구매 확정 실패: ' + tErr(error.message));
          return;
        }
        if (data && data.success === false) {
          await logWarn('ORDER_PURCHASE_CONFIRM_DENIED', { orderId, reason: data.error });
          alert(tErr(data.error));
          return;
        }
        await logInfo('ORDER_PURCHASE_CONFIRM', { orderId });
        await loadOrders();
      } catch (err) {
        await logError('ORDER_PURCHASE_CONFIRM_ERROR', { orderId, error: String(err) });
        alert('구매 확정 중 오류: ' + tErr(err.message));
      }
    }

    function toggleAllOrders(chk) {
      document.querySelectorAll('.order-chk').forEach(c => c.checked = chk.checked);
    }

    async function bulkDeliver() {
      const ids = [...document.querySelectorAll('.order-chk:checked')].map(c => c.value);
      if (ids.length === 0) { alert('지급 완료 처리할 항목을 선택해주세요.'); return; }
      if (!confirm(`${ids.length}건을 지급 완료 처리하시겠습니까?`)) return;

      let failCount = 0;
      for (const id of ids) {
        const { error } = await _sb.from('product_orders').update({
          status: 'delivered',
          delivered_at: new Date().toISOString(),
          delivered_by: session.id
        }).eq('id', id);
        if (error) { failCount++; await logError('ORDER_BULK_DELIVER_ITEM_FAIL', { orderId: id, error: error.message }); }
      }
      if (failCount > 0) alert(`${failCount}건 처리 실패. 로그를 확인해주세요.`);
      await logInfo('ORDER_BULK_DELIVER', { count: ids.length, failCount });
      await loadOrders();
    }

    async function updateOrderBadge() {
      const myRank = session.permissionRank || 0;
      if (myRank < 60) return;
      try {
        let query = _sb.from('product_orders').select('user_id,status', { count: 'exact' }).neq('status', 'delivered');
        const { data: orders, count } = await query;
        let processableCount = 0;
        if (myRank >= 90) {
          processableCount = count || 0;
        } else if (session.managedDeptId) {
          processableCount = (orders || []).filter(o => {
            const prof = profileMap[o.user_id];
            return prof && prof.department_id === session.managedDeptId;
          }).length;
        }
        const badge = document.getElementById('navOrderBadge');
        if (badge && processableCount > 0) {
          badge.textContent = processableCount;
          badge.classList.remove('hidden');
        }
      } catch (e) {}
    }

    function formatKSTShort(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${m}-${day} ${h}:${min}`;
    }
  </script>
  <script src="../js/version.js?v=3.13.1"></script>
</body>
</html>
