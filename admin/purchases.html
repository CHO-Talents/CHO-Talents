<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구매 관리 - CHO Talents Admin</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="../index.html" class="admin-nav-brand"><span class="brand-icon">⭐</span> 달란트 마을</a>
    <ul class="admin-nav-links">
      <li data-min-perm="80"><a href="index.html">대시보드</a></li>
      <li data-min-perm="60"><a href="users.html" id="navUsers">사용자 관리 <span class="badge hidden" id="navUserBadge">0</span></a></li>
      <li data-min-perm="60"><a href="departments.html">부서 관리</a></li>
      <li data-min-perm="80"><a href="managers.html">관리자 관리</a></li>
      <li><a href="../my-talents.html">내 달란트</a></li>
      <li data-min-perm="40"><a href="talents.html">달란트 관리</a></li>
      <li><a href="../shop.html">상품 구매</a></li>
      <li data-min-perm="60"><a href="shop.html">상품 관리</a></li>
      <li data-min-perm="60"><a href="purchases.html" class="active">구매 관리</a></li>
      <li data-min-perm="80"><a href="reports.html">보고서</a></li>
      <li data-min-perm="100"><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li data-min-perm="80"><a href="page-access.html">페이지 접근</a></li>
      <li data-min-perm="80"><a href="page-features.html">페이지 기능</a></li>
      <li data-min-perm="80"><a href="audit.html">작업 이력</a></li>
      <li data-min-perm="80"><a href="versions.html">버전</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">🛒 구매 관리</h2>

    <div class="filters" style="margin-bottom:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
      <button class="filter-btn active" id="tabRequested" onclick="switchPurchaseTab('requested')">📋 구매 신청</button>
      <button class="filter-btn" id="tabPreparing" onclick="switchPurchaseTab('preparing')">📦 상품 준비</button>
      <button class="filter-btn" id="tabPurchased" onclick="switchPurchaseTab('purchased')">💳 상품 구매</button>
      <button class="filter-btn" id="tabDelivered" onclick="switchPurchaseTab('delivered')">✅ 상품 지급</button>
    </div>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title" id="tableTitle">구매 신청 목록</div>
        <div id="bulkActions" style="display:none;">
          <button class="btn-confirm" id="btnBulkDeliver" onclick="bulkDeliver()" style="padding:0.4rem 1rem;font-size:0.85rem;">✅ 선택 지급 완료</button>
        </div>
      </div>
      <table class="admin-table">
        <thead>
          <tr id="tableHead">
            <th>신청일</th><th>상품명</th><th>가격</th><th>신청자</th><th>부서</th><th>상태</th><th>관리</th>
          </tr>
        </thead>
        <tbody id="orderList"><tr><td colspan="7" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=3.9.0"></script>
  <script src="../js/activity-log.js?v=3.9.0"></script>
  <script src="../js/auth.js?v=3.9.0"></script>
  <script src="../js/user-mgmt.js?v=3.9.0"></script>
  <script>
    initSupabase();
    let session;
    let currentPTab = 'requested';
    let allOrders = [];
    let profileMap = {};

    const STATUS_LABEL = { requested:'구매 신청', preparing:'상품 준비', purchased:'상품 구매', delivered:'상품 지급' };
    const STATUS_COLOR = { requested:'#868e96', preparing:'#e67700', purchased:'#1971c2', delivered:'#2b8a3e' };

    (async () => {
      session = await initPage(60, '../login.html');
      if (!session) return;
      applyPermNav(session.permissionRank || 0);
      renderRoleBadge('navUser', session, '../');
      autoLogPageView();
      updatePendingBadge();
      await loadOrders();
    })();

    function switchPurchaseTab(tab) {
      currentPTab = tab;
      ['requested','preparing','purchased','delivered'].forEach(t => {
        document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.toggle('active', t === tab);
      });
      renderOrders();
    }

    async function loadOrders() {
      const { data, error } = await _sb.from('product_orders').select('*').order('created_at', { ascending: false });
      if (error) {
        logError('PURCHASE_LOAD_FAIL', { error: error.message });
        document.getElementById('orderBody').innerHTML = '<tr><td colspan="7" class="empty-state">데이터 조회 실패: ' + error.message + '</td></tr>';
        return;
      }
      allOrders = data || [];

      const userIds = [...new Set(allOrders.map(o => o.user_id))];
      if (userIds.length > 0) {
        const { data: profiles } = await _sb.from('profiles').select('id,display_name,username,department_id').in('id', userIds);
        profileMap = {};
        (profiles || []).forEach(p => { profileMap[p.id] = p; });
      }

      const deptRes = await _sb.from('departments').select('id,name');
      const deptMap = {};
      (deptRes.data || []).forEach(d => { deptMap[d.id] = d.name; });
      allOrders.forEach(o => {
        const prof = profileMap[o.user_id];
        o._userName = prof ? (prof.display_name || prof.username) : '-';
        o._deptId = prof ? prof.department_id : null;
        o._deptName = prof && prof.department_id ? (deptMap[prof.department_id] || '-') : '-';
      });

      renderOrders();
    }

    function getVisibleOrders() {
      let orders = allOrders.filter(o => o.status === currentPTab);
      const myRank = session.permissionRank || 0;
      if (myRank < 90) {
        if (myRank >= 60 && session.managedDeptId) {
          if (myRank < 80) {
            orders = orders.filter(o => o._deptId === session.managedDeptId);
          }
        } else if (myRank < 80) {
          orders = [];
        }
      }
      return orders;
    }

    function canProcessOrder(order) {
      const myRank = session.permissionRank || 0;
      if (currentPTab === 'requested') {
        if (myRank >= 90) return true;
        if (myRank >= 60 && session.managedDeptId && order._deptId === session.managedDeptId) return true;
        return false;
      }
      if (currentPTab === 'preparing') return myRank >= 100;
      if (currentPTab === 'purchased') return myRank >= 100;
      return false;
    }

    function renderOrders() {
      const orders = getVisibleOrders();
      const tbody = document.getElementById('orderList');
      const title = document.getElementById('tableTitle');
      title.textContent = `${STATUS_LABEL[currentPTab]} 목록 (${orders.length}건)`;

      const isAdmin = (session.permissionRank || 0) >= 100;
      const showBulk = currentPTab === 'purchased' && isAdmin;
      document.getElementById('bulkActions').style.display = showBulk ? '' : 'none';

      const headHtml = showBulk
        ? `<th style="width:30px;"><input type="checkbox" onchange="toggleAllOrders(this)"></th><th>신청일</th><th>상품명</th><th>가격</th><th>신청자</th><th>부서</th><th>상태</th><th>관리</th>`
        : `<th>신청일</th><th>상품명</th><th>가격</th><th>신청자</th><th>부서</th><th>상태</th><th>관리</th>`;
      document.getElementById('tableHead').innerHTML = headHtml;

      if (orders.length === 0) {
        const colCount = showBulk ? 8 : 7;
        tbody.innerHTML = `<tr><td colspan="${colCount}" class="empty-state">해당 상태의 주문이 없습니다.</td></tr>`;
        return;
      }

      tbody.innerHTML = orders.map(o => {
        const canProc = canProcessOrder(o);
        let actionBtn = '';
        if (currentPTab === 'requested' && canProc) {
          actionBtn = `<button class="filter-btn" style="font-size:0.78rem;padding:0.3rem 0.6rem;" onclick="updateStatus('${o.id}','preparing')">상품 준비</button>`;
        } else if (currentPTab === 'preparing' && canProc) {
          actionBtn = `<button class="filter-btn" style="font-size:0.78rem;padding:0.3rem 0.6rem;background:#1971c2;color:#fff;border-color:#1971c2;" onclick="confirmPurchase('${o.id}')">구매 확정</button>`;
        } else if (currentPTab === 'purchased' && canProc) {
          actionBtn = `<button class="filter-btn" style="font-size:0.78rem;padding:0.3rem 0.6rem;background:#2b8a3e;color:#fff;border-color:#2b8a3e;" onclick="updateStatus('${o.id}','delivered')">지급 완료</button>`;
        }
        const chkTd = showBulk ? `<td><input type="checkbox" class="order-chk" value="${o.id}"></td>` : '';
        const statusBadge = `<span style="padding:0.15rem 0.5rem;border-radius:4px;font-size:0.78rem;background:${STATUS_COLOR[o.status]}22;color:${STATUS_COLOR[o.status]};font-weight:600;">${STATUS_LABEL[o.status]}</span>`;
        return `<tr>
          ${chkTd}
          <td style="font-size:0.8rem;">${formatKSTShort(o.requested_at || o.created_at)}</td>
          <td>${o.product_name}</td>
          <td>${o.price}</td>
          <td>${o._userName}</td>
          <td>${o._deptName}</td>
          <td>${statusBadge}</td>
          <td>${actionBtn}</td>
        </tr>`;
      }).join('');
    }

    async function updateStatus(orderId, newStatus) {
      try {
        const updateFields = { status: newStatus };
        if (newStatus === 'preparing') { updateFields.prepared_at = new Date().toISOString(); updateFields.prepared_by = session.id; }
        if (newStatus === 'delivered') { updateFields.delivered_at = new Date().toISOString(); updateFields.delivered_by = session.id; }

        const { error } = await _sb.from('product_orders').update(updateFields).eq('id', orderId);
        if (error) {
          await logError('ORDER_STATUS_CHANGE_FAIL', { orderId, newStatus, error: error.message });
          alert('상태 변경 실패: ' + error.message);
          return;
        }
        await logInfo('ORDER_STATUS_CHANGE', { orderId, newStatus });
        await loadOrders();
      } catch (err) {
        await logError('ORDER_STATUS_CHANGE_ERROR', { orderId, newStatus, error: String(err) });
        alert('상태 변경 중 오류: ' + err.message);
      }
    }

    async function confirmPurchase(orderId) {
      if (!confirm('상품 구매를 확정하시겠습니까?\n달란트가 실제 차감됩니다.')) return;
      try {
        const { data, error } = await _sb.rpc('confirm_product_purchase', {
          p_order_id: orderId,
          p_admin_id: session.id
        });
        if (error) {
          await logError('ORDER_PURCHASE_CONFIRM_FAIL', { orderId, error: error.message });
          alert('구매 확정 실패: ' + error.message);
          return;
        }
        if (data && data.success === false) {
          await logWarn('ORDER_PURCHASE_CONFIRM_DENIED', { orderId, reason: data.error });
          alert(data.error);
          return;
        }
        await logInfo('ORDER_PURCHASE_CONFIRM', { orderId });
        await loadOrders();
      } catch (err) {
        await logError('ORDER_PURCHASE_CONFIRM_ERROR', { orderId, error: String(err) });
        alert('구매 확정 중 오류: ' + err.message);
      }
    }

    function toggleAllOrders(chk) {
      document.querySelectorAll('.order-chk').forEach(c => c.checked = chk.checked);
    }

    async function bulkDeliver() {
      const ids = [...document.querySelectorAll('.order-chk:checked')].map(c => c.value);
      if (ids.length === 0) { alert('지급 완료 처리할 항목을 선택해주세요.'); return; }
      if (!confirm(`${ids.length}건을 지급 완료 처리하시겠습니까?`)) return;

      let failCount = 0;
      for (const id of ids) {
        const { error } = await _sb.from('product_orders').update({
          status: 'delivered',
          delivered_at: new Date().toISOString(),
          delivered_by: session.id
        }).eq('id', id);
        if (error) { failCount++; await logError('ORDER_BULK_DELIVER_ITEM_FAIL', { orderId: id, error: error.message }); }
      }
      if (failCount > 0) alert(`${failCount}건 처리 실패. 로그를 확인해주세요.`);
      await logInfo('ORDER_BULK_DELIVER', { count: ids.length, failCount });
      await loadOrders();
    }

    function formatKSTShort(dateStr) {
      if (!dateStr) return '-';
      const d = new Date(dateStr);
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      const h = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${m}-${day} ${h}:${min}`;
    }
  </script>
  <script src="../js/version.js?v=3.9.0"></script>
</body>
</html>
