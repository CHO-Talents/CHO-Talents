<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 관리 - CHO Talents Admin</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="index.html" class="admin-nav-brand">CHO-Talents Admin</a>
    <ul class="admin-nav-links">
      <li><a href="../index.html">🏠 메인</a></li>
      <li><a href="index.html">대시보드</a></li>
      <li><a href="users.html">사용자 관리</a></li>
      <li data-role="admin"><a href="departments.html">부서 관리</a></li>
      <li data-role="admin"><a href="managers.html" class="active">관리자 관리</a></li>
      <li><a href="talents.html">달란트 관리</a></li>
      <li><a href="products.html">물품 관리</a></li>
      <li data-role="admin"><a href="shop.html">상점 관리</a></li>
      <li data-role="admin"><a href="reports.html">보고서</a></li>
      <li data-role="admin"><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li data-role="admin"><a href="versions.html">버전</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">관리자 관리</h2>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title" id="tableTitle">관리자 목록</div>
        <div class="filters">
          <button class="filter-btn active" onclick="setFilter('all',this)">전체</button>
          <button class="filter-btn" onclick="setFilter('admin',this)">👑 관리자</button>
          <button class="filter-btn" onclick="setFilter('dept_manager',this)">📋 부서 관리자</button>
          <span style="margin-left:0.5rem;"></span>
          <button class="filter-btn" style="background:var(--admin-primary);color:#fff;" onclick="openAddModal()">+ 관리자 등록</button>
        </div>
      </div>
      <table class="admin-table">
        <thead><tr><th>역할</th><th>아이디</th><th>이름</th><th>소속 부서</th><th>담당 부서</th><th>달란트</th><th>등록일</th><th>관리</th></tr></thead>
        <tbody id="mgrList"><tr><td colspan="8" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay hidden" id="mgrModal">
    <div class="modal-box">
      <h3 class="modal-title" id="modalTitle">관리자 등록</h3>
      <div class="form-error" id="modalError"></div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">아이디</label>
        <input type="text" id="mUsername" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">이름</label>
        <input type="text" id="mDisplayName" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">역할</label>
        <select id="mRole" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" onchange="onRoleChange()">
          <option value="dept_manager">📋 부서 관리자</option>
          <option value="admin">👑 관리자</option>
        </select>
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">소속 부서</label>
        <select id="mOwnDeptId" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;">
          <option value="">-- 부서 선택 --</option>
        </select>
      </div>
      <div id="managedDeptWrap" style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">담당 관리 부서</label>
        <select id="mDeptId" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;">
          <option value="">-- 부서 선택 --</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-confirm" onclick="saveManager()">저장</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/activity-log.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/user-mgmt.js"></script>
  <script>
    initSupabase();
    let session;
    let editingId = null;
    let deptList = [];
    (async () => {
      session = await initPage(['admin'], '../login.html');
      if (!session) return;
      if (session) {
        renderRoleBadge('navUser', session, '../');
        autoLogPageView();
        updateBadge();
        loadData();
      }
    })();

    async function updateBadge() {
      const count = await getUnacknowledgedCount();
      const badge = document.getElementById('navLogBadge');
      if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
    }

    async function loadData() {
      const { data: depts } = await fetchDepartments();
      deptList = depts || [];
      const opts = '<option value="">-- 부서 선택 --</option>' +
        deptList.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
      document.getElementById('mDeptId').innerHTML = opts;
      document.getElementById('mOwnDeptId').innerHTML = opts;
      await loadManagers();
    }

    function onRoleChange() {
      const role = document.getElementById('mRole').value;
      document.getElementById('managedDeptWrap').style.display = (role === 'dept_manager' || role === 'admin') ? '' : 'none';
    }

    let allManagers = [];
    let currentFilter = 'all';

    function setFilter(role, btn) {
      currentFilter = role;
      document.querySelectorAll('.admin-table-header .filter-btn:not([style*="background:var(--admin-primary)"])').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderManagers();
    }

    async function loadManagers() {
      const [adminsRes, mgrsRes] = await Promise.all([
        fetchUsers({ role: 'admin' }),
        fetchUsers({ role: 'dept_manager' })
      ]);
      allManagers = [...(adminsRes.data || []), ...(mgrsRes.data || [])];
      renderManagers();
    }

    function renderManagers() {
      const list = currentFilter === 'all' ? allManagers : allManagers.filter(u => u.role === currentFilter);
      const tbody = document.getElementById('mgrList');
      document.getElementById('tableTitle').textContent = `관리자 목록 (${list.length}명)`;

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="empty-state">등록된 관리자가 없습니다.</td></tr>';
        return;
      }

      const ROLE_BADGE = { admin: { emoji: '👑', label: '관리자', cls: 'ERROR' }, dept_manager: { emoji: '📋', label: '부서관리자', cls: 'WARN' } };

      tbody.innerHTML = list.map(u => {
        const rb = ROLE_BADGE[u.role] || ROLE_BADGE.admin;
        const ownDept = deptList.find(d => d.id === u.department_id);
        const mgrDept = deptList.find(d => d.id === u.managed_dept_id);
        const isSelf = u.id === session.id;
        return `<tr>
          <td><span class="level-badge ${rb.cls}">${rb.emoji} ${rb.label}</span></td>
          <td><strong>${u.username}</strong></td>
          <td>${u.display_name || '-'}</td>
          <td>${ownDept ? ownDept.name : '-'}</td>
          <td>${mgrDept ? mgrDept.name : '<span style="color:var(--admin-text-muted);">-</span>'}</td>
          <td style="font-weight:700;">${u.talent_balance || 0}</td>
          <td>${formatKSTShort(u.created_at)}</td>
          <td>
            <button class="filter-btn" onclick="openEditModal('${u.id}','${u.username}','${u.display_name||''}','${u.managed_dept_id||''}')">수정</button>
            <button class="filter-btn" onclick="resetPw('${u.id}','${u.username}')">비밀번호 초기화</button>
            ${!isSelf ? `<button class="btn-ack" onclick="confirmDelete('${u.id}','${u.username}')">삭제</button>` : ''}
          </td>
        </tr>`;
      }).join('');
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '관리자 등록';
      document.getElementById('mUsername').value = ''; document.getElementById('mUsername').disabled = false;
      document.getElementById('mDisplayName').value = '';
      document.getElementById('mRole').value = 'dept_manager'; document.getElementById('mRole').disabled = false;
      document.getElementById('mOwnDeptId').value = '';
      document.getElementById('mDeptId').value = '';
      onRoleChange();
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('mgrModal').classList.remove('hidden');
    }

    function openEditModal(id, username, displayName, managedDeptId) {
      editingId = id;
      const user = allManagers.find(u => u.id === id);
      document.getElementById('modalTitle').textContent = '관리자 수정';
      document.getElementById('mUsername').value = username; document.getElementById('mUsername').disabled = true;
      document.getElementById('mDisplayName').value = displayName;
      document.getElementById('mRole').value = user ? user.role : 'dept_manager'; document.getElementById('mRole').disabled = true;
      document.getElementById('mOwnDeptId').value = user ? (user.department_id || '') : '';
      document.getElementById('mDeptId').value = managedDeptId || '';
      onRoleChange();
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('mgrModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('mgrModal').classList.add('hidden'); }

    async function saveManager() {
      const errEl = document.getElementById('modalError');
      const username = document.getElementById('mUsername').value.trim();
      const displayName = document.getElementById('mDisplayName').value.trim();
      const role = document.getElementById('mRole').value;
      const ownDeptId = document.getElementById('mOwnDeptId').value || null;
      const managedDeptId = document.getElementById('mDeptId').value || null;

      if (!username) { errEl.textContent = '아이디를 입력해주세요.'; errEl.classList.add('show'); return; }

      if (editingId) {
        const updates = { displayName, departmentId: ownDeptId, managedDeptId };
        const { error } = await updateUser(editingId, updates);
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      } else {
        const { error } = await createUser({
          username, displayName: displayName || username,
          role, departmentId: ownDeptId, managedDeptId
        });
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      }
      closeModal();
      await loadManagers();
    }

    async function resetPw(id, username) {
      if (!confirm(`"${username}" 비밀번호를 1234로 초기화하시겠습니까?`)) return;
      await resetUserPassword(id, username);
      alert('비밀번호가 초기화되었습니다.');
    }

    async function confirmDelete(id, username) {
      if (!confirm(`"${username}" 부서 관리자를 삭제하시겠습니까?`)) return;
      await deleteUser(id);
      await loadManagers();
    }

    document.getElementById('mgrModal').addEventListener('click', e => { if(e.target.classList.contains('modal-overlay')) closeModal(); });
  </script>
  <script src="../js/version.js"></script>
</body>
</html>
