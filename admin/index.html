<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 대시보드 - CHO Talents</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="index.html" class="admin-nav-brand">CHO-Talents Admin</a>
    <ul class="admin-nav-links">
      <li><a href="../index.html">🏠 메인</a></li>
      <li><a href="index.html" class="active">대시보드</a></li>
      <li><a href="users.html">사용자 관리</a></li><li><a href="departments.html">부서 관리</a></li>
      <li><a href="managers.html">관리자 관리</a></li>
      <li><a href="shop.html">상점 관리</a></li>
      <li><a href="reports.html">보고서</a></li>
      <li><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li><a href="versions.html">버전</a></li><li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <div class="alert-banner hidden" id="alertBanner">
      <span>&#9888;</span>
      <span id="alertText">미확인 ERROR 로그가 있습니다.</span>
      <a href="logs.html" style="margin-left:auto;color:inherit;font-weight:700;">확인하기</a>
    </div>

    <h2 style="margin-bottom:1rem;">관리자 대시보드</h2>

    <div class="cards-grid">
      <div class="stat-card">
        <div class="stat-card-label">전체 사용자</div>
        <div class="stat-card-value" id="totalUsers">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">부서</div>
        <div class="stat-card-value" id="totalDepts">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">보고서</div>
        <div class="stat-card-value" id="totalReports">-</div>
      </div>
      <div class="stat-card error-card">
        <div class="stat-card-label">미확인 ERROR+</div>
        <div class="stat-card-value" id="unackCount">-</div>
      </div>
    </div>

    <div class="cards-grid" style="margin-bottom:1.5rem;">
      <div class="stat-card" style="border-left-color:#51cf66;">
        <div class="stat-card-label">학생</div>
        <div class="stat-card-value" id="studentCount">-</div>
      </div>
      <div class="stat-card" style="border-left-color:#4dabf7;">
        <div class="stat-card-label">교사</div>
        <div class="stat-card-value" id="teacherCount">-</div>
      </div>
      <div class="stat-card" style="border-left-color:#cc5de8;">
        <div class="stat-card-label">부서 관리자</div>
        <div class="stat-card-value" id="managerCount">-</div>
      </div>
      <a href="users.html" class="stat-card" style="border-left-color:#e67700;text-decoration:none;color:inherit;">
        <div class="stat-card-label">📝 가입 대기자</div>
        <div class="stat-card-value" id="pendingCount">-</div>
      </a>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem;">
      <a href="users.html" style="display:block;padding:1rem;background:#e8e0ff;border-radius:12px;text-decoration:none;text-align:center;">
        <div style="font-size:1.8rem;">👥</div>
        <div style="font-weight:700;color:var(--admin-primary);">사용자 관리</div>
      </a>
      <a href="departments.html" style="display:block;padding:1rem;background:#f3f0ff;border-radius:12px;text-decoration:none;text-align:center;">
        <div style="font-size:1.8rem;">🏢</div>
        <div style="font-weight:700;color:#7048c6;">부서 관리</div>
      </a>
      <a href="managers.html" style="display:block;padding:1rem;background:#fff9db;border-radius:12px;text-decoration:none;text-align:center;">
        <div style="font-size:1.8rem;">👑</div>
        <div style="font-weight:700;color:#e67700;">관리자 관리</div>
      </a>
      <a href="shop.html" style="display:block;padding:1rem;background:#f0fff4;border-radius:12px;text-decoration:none;text-align:center;">
        <div style="font-size:1.8rem;">🛒</div>
        <div style="font-weight:700;color:#2b8a3e;">상점 관리</div>
      </a>
      <a href="../manager/students.html" style="display:block;padding:1rem;background:#fff5f5;border-radius:12px;text-decoration:none;text-align:center;">
        <div style="font-size:1.8rem;">💰</div>
        <div style="font-weight:700;color:#e03131;">달란트 관리</div>
      </a>
    </div>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title">최근 활동 로그</div>
      </div>
      <table class="admin-table">
        <thead><tr><th>시간</th><th>레벨</th><th>액션</th><th>페이지</th><th>사용자</th></tr></thead>
        <tbody id="recentLogs"><tr><td colspan="5" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/activity-log.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    initSupabase();
    let session;
    (async () => {
      session = await initPage(['admin'], '../login.html');
      if (!session) return;
      if (session && session.isFirstLogin) {
        window.location.href = 'change-password.html';
      }

      if (session) {
        renderRoleBadge('navUser', session, '../');
        autoLogPageView();
        loadDashboard();
      }

    })();

    async function loadDashboard() {
      const [usersRes, deptsRes, reportsRes, unack,
             studentsRes, teachersRes, managersRes, pendingRes] = await Promise.all([
        _sb.from('profiles').select('*', { count: 'exact', head: true }),
        _sb.from('departments').select('*', { count: 'exact', head: true }).eq('is_active', true),
        _sb.from('reports').select('*', { count: 'exact', head: true }),
        getUnacknowledgedCount(),
        _sb.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'student'),
        _sb.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'teacher'),
        _sb.from('profiles').select('*', { count: 'exact', head: true }).eq('role', 'dept_manager'),
        _sb.from('registration_requests').select('*', { count: 'exact', head: true }).eq('status', 'pending')
      ]);

      document.getElementById('totalUsers').textContent = usersRes.count || 0;
      document.getElementById('totalDepts').textContent = deptsRes.count || 0;
      document.getElementById('totalReports').textContent = reportsRes.count || 0;
      document.getElementById('unackCount').textContent = unack;
      document.getElementById('studentCount').textContent = studentsRes.count || 0;
      document.getElementById('teacherCount').textContent = teachersRes.count || 0;
      document.getElementById('managerCount').textContent = managersRes.count || 0;
      document.getElementById('pendingCount').textContent = pendingRes.count || 0;

      const badge = document.getElementById('navLogBadge');
      const banner = document.getElementById('alertBanner');
      if (unack > 0) {
        badge.textContent = unack; badge.classList.remove('hidden');
        banner.classList.remove('hidden');
        document.getElementById('alertText').textContent = `미확인 ERROR 이상 로그가 ${unack}건 있습니다.`;
      }

      const { data: logs } = await fetchLogs({ limit: 10 });
      const tbody = document.getElementById('recentLogs');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">로그가 없습니다.</td></tr>';
        return;
      }
      tbody.innerHTML = logs.map(l => `<tr>
        <td>${formatKSTShort(l.created_at)}</td>
        <td><span class="level-badge ${l.level}">${l.level}</span></td>
        <td>${l.action}</td>
        <td>${l.page || '-'}</td>
        <td>${l.username || '-'}</td>
      </tr>`).join('');
    }
  </script>
  <script src="../js/version.js"></script>
</body>
</html>
