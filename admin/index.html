<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 대시보드 - CHO Talents</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="index.html" class="admin-nav-brand">CHO-Talents Admin</a>
    <ul class="admin-nav-links">
      <li><a href="index.html" class="active">대시보드</a></li>
      <li><a href="reports.html">보고서</a></li>
      <li><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout()">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <div class="alert-banner hidden" id="alertBanner">
      <span>&#9888;</span>
      <span id="alertText">미확인 ERROR 로그가 있습니다.</span>
      <a href="logs.html" style="margin-left:auto;color:inherit;font-weight:700;">확인하기</a>
    </div>

    <h2 style="margin-bottom:1rem;">대시보드</h2>

    <div class="cards-grid">
      <div class="stat-card">
        <div class="stat-card-label">전체 보고서</div>
        <div class="stat-card-value" id="totalReports">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">전체 로그</div>
        <div class="stat-card-value" id="totalLogs">-</div>
      </div>
      <div class="stat-card error-card">
        <div class="stat-card-label">미확인 ERROR+</div>
        <div class="stat-card-value" id="unackCount">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">현재 시간 (KST)</div>
        <div class="stat-card-value" id="kstClock" style="font-size:1.2rem;">-</div>
      </div>
    </div>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title">최근 활동 로그</div>
      </div>
      <table class="admin-table">
        <thead>
          <tr><th>시간</th><th>레벨</th><th>액션</th><th>페이지</th><th>사용자</th></tr>
        </thead>
        <tbody id="recentLogs">
          <tr><td colspan="5" class="empty-state">로딩 중...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/activity-log.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    initSupabase();
    const session = requireAuth('login.html');
    if (session && session.isFirstLogin) {
      window.location.href = 'change-password.html';
    }

    if (session) {
      document.getElementById('navUser').textContent = session.displayName || session.username;
      autoLogPageView();
      loadDashboard();
    }

    function updateClock() {
      document.getElementById('kstClock').textContent = formatKST();
    }
    updateClock();
    setInterval(updateClock, 1000);

    async function loadDashboard() {
      const [reportsRes, logsCountRes, unack] = await Promise.all([
        _sb.from('reports').select('*', { count: 'exact', head: true }),
        _sb.from('activity_logs').select('*', { count: 'exact', head: true }),
        getUnacknowledgedCount()
      ]);

      document.getElementById('totalReports').textContent = reportsRes.count || 0;
      document.getElementById('totalLogs').textContent = logsCountRes.count || 0;
      document.getElementById('unackCount').textContent = unack;

      const badge = document.getElementById('navLogBadge');
      const banner = document.getElementById('alertBanner');
      if (unack > 0) {
        badge.textContent = unack;
        badge.classList.remove('hidden');
        banner.classList.remove('hidden');
        document.getElementById('alertText').textContent =
          `미확인 ERROR 이상 로그가 ${unack}건 있습니다. 확인이 필요합니다.`;
      }

      const { data: logs } = await fetchLogs({ limit: 10 });
      const tbody = document.getElementById('recentLogs');
      if (!logs || logs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">로그가 없습니다.</td></tr>';
        return;
      }
      tbody.innerHTML = logs.map(l => `
        <tr>
          <td>${formatKSTShort(l.created_at)}</td>
          <td><span class="level-badge ${l.level}">${l.level}</span></td>
          <td>${l.action}</td>
          <td>${l.page || '-'}</td>
          <td>${l.username || '-'}</td>
        </tr>
      `).join('');
    }
  </script>
</body>
</html>
