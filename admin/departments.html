<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부서 관리 - CHO Talents Admin</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="../index.html" class="admin-nav-brand"><span class="brand-icon">⭐</span> 달란트 마을</a>
    <ul class="admin-nav-links">
      <li data-min-perm="80"><a href="index.html">대시보드</a></li>
      <li data-min-perm="60"><a href="users.html" id="navUsers">사용자 관리 <span class="badge hidden" id="navUserBadge">0</span></a></li>
      <li data-min-perm="60"><a href="departments.html" class="active">부서 관리</a></li>
      <li data-min-perm="80"><a href="managers.html">관리자 관리</a></li>
      <li><a href="../my-talents.html">내 달란트</a></li>
      <li data-min-perm="40"><a href="talents.html">달란트 관리</a></li>
      <li><a href="../shop.html">상품 구매</a></li>
      <li data-min-perm="60"><a href="shop.html">물품 관리</a></li>
      <li data-min-perm="80"><a href="reports.html">보고서</a></li>
      <li data-min-perm="100"><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li data-min-perm="80"><a href="page-access.html">페이지 접근</a></li>
      <li data-min-perm="80"><a href="page-features.html">페이지 기능</a></li>
      <li data-min-perm="80"><a href="audit.html">작업 이력</a></li>
      <li data-min-perm="80"><a href="versions.html">버전</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">부서 관리</h2>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title" id="tableTitle">부서 목록</div>
        <button class="filter-btn" style="background:var(--admin-primary);color:#fff;" onclick="openAddModal()">+ 부서 등록</button>
      </div>
      <table class="admin-table">
        <thead><tr><th>부서명</th><th>설명</th><th>반</th><th>전체</th><th>교사</th><th>학생</th><th>담당 관리자</th><th>관리</th></tr></thead>
        <tbody id="deptList"><tr><td colspan="9" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay hidden" id="deptModal">
    <div class="modal-box">
      <h3 class="modal-title" id="modalTitle">부서 등록</h3>
      <div class="form-error" id="modalError"></div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">부서명</label>
        <input type="text" id="mName" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">설명</label>
        <textarea id="mDesc" style="width:100%;min-height:60px;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;resize:vertical;"></textarea>
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">반 개수</label>
        <input type="number" id="mClassCount" min="0" max="20" value="0" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
        <div style="font-size:0.75rem;color:#b2bec3;margin-top:0.2rem;">0 = 반 구분 없음</div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-confirm" onclick="saveDept()">저장</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=3.8.4"></script>
  <script src="../js/activity-log.js?v=3.8.4"></script>
  <script src="../js/auth.js?v=3.8.4"></script>
  <script src="../js/user-mgmt.js?v=3.8.4"></script>
  <script>
    initSupabase();
    let session;
    let editingId = null;
    let allUsers = [];
    let allDeptData = [];
    (async () => {
      session = await initPage(60, '../login.html');
      if (!session) return;
      applyPermNav(session.permissionRank || 0);
      if (session) {
        renderRoleBadge('navUser', session, '../');
        autoLogPageView();
        updatePendingBadge();
        updateBadge();
        const myRank = session.permissionRank || 0;
        if (myRank < 90) {
          document.querySelector('.filter-btn[onclick="openAddModal()"]').style.display = 'none';
        }
        loadDepts();
      }
    })();

    async function updateBadge() {
      const count = await getUnacknowledgedCount();
      const badge = document.getElementById('navLogBadge');
      if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
    }

    async function loadDepts() {
      const { data: depts } = await fetchDepartments();
      const { data: users } = await _sb.from('profiles')
        .select('id, username, user_type, permission_level, department_id, managed_dept_id, display_name');
      allUsers = users || [];

      const myRank = session.permissionRank || 0;
      const myManagedDept = session.managedDeptId || session.departmentId;

      let filteredDepts = depts || [];
      if (myRank < 80) {
        filteredDepts = myManagedDept ? filteredDepts.filter(d => d.id === myManagedDept) : [];
      }

      const tbody = document.getElementById('deptList');
      document.getElementById('tableTitle').textContent = `부서 목록 (${filteredDepts.length}개)`;

      if (filteredDepts.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="empty-state">등록된 부서가 없습니다.</td></tr>';
        allDeptData = [];
        return;
      }

      allDeptData = filteredDepts;
      tbody.innerHTML = filteredDepts.map(d => {
        const deptUsers = (users||[]).filter(u => u.department_id === d.id);
        const teachers = deptUsers.filter(u => u.user_type === 'teacher');
        const students = deptUsers.filter(u => u.user_type === 'student');
        const managers = (users||[]).filter(u => u.managed_dept_id === d.id && ['admin', 'evangelist', 'chief', 'dept_teacher'].includes(u.permission_level));
        const managerNames = managers.map(m => {
          const e = PERMISSION_EMOJI[m.permission_level] || '📋';
          return `${e}${m.display_name || '-'}`;
        }).join(', ') || '-';
        const classLabel = d.class_count > 0 ? d.class_count + '개' : '없음';

        return `<tr>
          <td><strong>${d.name}</strong></td>
          <td>${d.description || '-'}</td>
          <td>${classLabel}</td>
          <td style="font-weight:700;">${deptUsers.length}명</td>
          <td>${teachers.length}명</td>
          <td>${students.length}명</td>
          <td style="font-size:0.8rem;">${managerNames}</td>
          <td>
            ${(myRank >= 90 || d.id === myManagedDept) ? `<button class="filter-btn" onclick="openEditModal('${d.id}')">수정</button>` : ''}
            ${myRank >= 90 ? `<button class="btn-ack" onclick="confirmDelete('${d.id}','${d.name}')">삭제</button>` : ''}
            <button class="filter-btn" onclick="showMembers('${d.name}', '${d.id}')">소속보기</button>
          </td>
        </tr>`;
      }).join('');
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '부서 등록';
      document.getElementById('mName').value = '';
      document.getElementById('mDesc').value = '';
      document.getElementById('mClassCount').value = '0';
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('deptModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      editingId = id;
      const dept = allDeptData.find(d => d.id === id);
      document.getElementById('modalTitle').textContent = '부서 수정';
      document.getElementById('mName').value = dept ? dept.name : '';
      document.getElementById('mDesc').value = dept ? (dept.description || '') : '';
      document.getElementById('mClassCount').value = dept ? (dept.class_count || 0) : 0;
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('deptModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('deptModal').classList.add('hidden'); }

    async function saveDept() {
      const errEl = document.getElementById('modalError');
      const name = document.getElementById('mName').value.trim();
      const desc = document.getElementById('mDesc').value.trim();
      const classCount = parseInt(document.getElementById('mClassCount').value) || 0;
      if (!name) { errEl.textContent = '부서명을 입력해주세요.'; errEl.classList.add('show'); return; }

      if (editingId) {
        const { error } = await updateDepartment(editingId, { name, description: desc || null, class_count: classCount });
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      } else {
        const { error } = await createDepartment(name, desc || null, classCount);
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      }
      closeModal();
      await loadDepts();
    }

    async function confirmDelete(id, name) {
      if (!confirm(`"${name}" 부서를 비활성화하시겠습니까?`)) return;
      await deleteDepartment(id);
      await loadDepts();
    }

    function showMembers(deptName, deptId) {
      const members = allUsers.filter(u => u.department_id === deptId);
      const dept = allDeptData.find(d => d.id === deptId);
      const hasClasses = dept && dept.class_count > 0;

      const nameMap = resolveDisplayNames(members);
      let html = `<strong>${deptName}</strong> 소속 인원 (${members.length}명)<br/><br/>`;
      if (members.length === 0) {
        html += '<div style="color:#636e72;">소속 인원이 없습니다.</div>';
      } else {
        html += `<table class="admin-table" style="font-size:0.85rem;"><thead><tr><th>역할</th><th>권한</th><th>이름</th>${hasClasses ? '<th>반</th>' : ''}</tr></thead><tbody>`;
        html += members.map(u => {
          const typeLabel = u.user_type === 'student' ? '🎒 학생' : '👩‍🏫 교사';
          const permLabel = (PERMISSION_EMOJI[u.permission_level]||'') + ' ' + (PERMISSION_LABELS[u.permission_level]||u.permission_level);
          const dn = nameMap[u.id] || u.display_name || '-';
          const isSelf = u.id === session.id;
          const classNum = u.class_number ? u.class_number + '반' : '-';
          return `<tr><td>${typeLabel}</td><td>${permLabel}</td><td>${dn}${(isSelf || isAdminLevel(session)) ? ' <span style="font-size:0.72rem;color:#868e96;">(' + u.username + ')</span>' : ''}</td>${hasClasses ? '<td>' + classNum + '</td>' : ''}</tr>`;
        }).join('');
        html += '</tbody></table>';
      }

      document.getElementById('modalTitle').textContent = '부서 소속 인원';
      document.getElementById('mName').parentElement.style.display = 'none';
      document.getElementById('mDesc').parentElement.style.display = 'none';
      document.getElementById('mClassCount').parentElement.style.display = 'none';
      document.querySelector('#deptModal .modal-actions .btn-confirm').style.display = 'none';
      document.getElementById('modalError').innerHTML = html;
      document.getElementById('modalError').style.display = 'block';
      document.getElementById('modalError').style.background = 'transparent';
      document.getElementById('modalError').style.color = 'inherit';
      document.getElementById('deptModal').classList.remove('hidden');
    }

    const origCloseModal = closeModal;
    closeModal = function() {
      document.getElementById('mName').parentElement.style.display = '';
      document.getElementById('mDesc').parentElement.style.display = '';
      document.getElementById('mClassCount').parentElement.style.display = '';
      document.querySelector('#deptModal .modal-actions .btn-confirm').style.display = '';
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('modalError').style.display = '';
      document.getElementById('modalError').style.background = '';
      document.getElementById('modalError').style.color = '';
      document.getElementById('modalError').innerHTML = '';
      document.getElementById('deptModal').classList.add('hidden');
    };

    document.getElementById('deptModal').addEventListener('click', e => { if(e.target.classList.contains('modal-overlay')) closeModal(); });
  </script>
  <script src="../js/version.js?v=3.8.4"></script>
</body>
</html>
