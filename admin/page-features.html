<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지 기능 관리 - 달란트 마을</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="../index.html" class="admin-nav-brand">⭐ 달란트 마을</a>
    <ul class="admin-nav-links">
      <li data-min-perm="80"><a href="index.html">대시보드</a></li>
      <li data-min-perm="60"><a href="users.html" id="navUsers">사용자 관리 <span class="badge hidden" id="navUserBadge">0</span></a></li>
      <li data-min-perm="60"><a href="departments.html">부서 관리</a></li>
      <li data-min-perm="80"><a href="managers.html">관리자 관리</a></li>
      <li><a href="../my-talents.html">내 달란트</a></li>
      <li data-min-perm="40"><a href="talents.html">달란트 관리</a></li>
      <li><a href="../shop.html">상품 구매</a></li>
      <li data-min-perm="60"><a href="shop.html">물품 관리</a></li>
      <li data-min-perm="80"><a href="reports.html">보고서</a></li>
      <li data-min-perm="100"><a href="logs.html" id="navLogs">로그 <span class="badge hidden" id="navLogBadge">0</span></a></li>
      <li data-min-perm="80"><a href="page-access.html">페이지 접근</a></li>
      <li data-min-perm="80"><a href="page-features.html">페이지 기능</a></li>
      <li data-min-perm="80"><a href="versions.html">버전</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">⚙️ 페이지 기능 관리</h2>
    <p style="font-size:0.85rem;color:var(--admin-text-muted);margin-bottom:1rem;">사용자별로 각 페이지에서 사용 가능한 기능(수정, 삭제, 승인 등)을 관리합니다.</p>

    <div class="filters" style="margin-bottom:1rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
      <button class="filter-btn active" onclick="filterUsers('all',this)">전체</button>
      <button class="filter-btn" onclick="filterUsers('teacher',this)">교사</button>
      <button class="filter-btn" onclick="filterUsers('student',this)">학생</button>
      <input type="text" id="searchInput" placeholder="이름 검색..." style="padding:0.5rem;border:1px solid var(--admin-border);border-radius:8px;flex:1;min-width:150px;" oninput="renderTable()" />
    </div>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title" id="tableTitle">사용자 목록</div>
      </div>
      <table class="admin-table">
        <thead><tr><th>유형</th><th>권한</th><th>이름</th><th>부서</th><th>관리</th></tr></thead>
        <tbody id="userList"><tr><td colspan="5" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay hidden" id="featureModal">
    <div class="modal-box" style="max-width:750px;max-height:85vh;overflow-y:auto;">
      <h3 class="modal-title" id="featureTitle">페이지 기능 설정</h3>
      <div class="form-error" id="featureError"></div>
      <div id="featureBody"></div>
      <div class="modal-actions" style="margin-top:1rem;">
        <button class="btn-cancel" onclick="closeFeatureModal()">취소</button>
        <button class="btn-confirm" id="btnSaveFeature" onclick="saveFeatures()">저장</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js?v=3.8.0"></script>
  <script src="../js/activity-log.js?v=3.8.0"></script>
  <script src="../js/auth.js?v=3.8.0"></script>
  <script src="../js/user-mgmt.js?v=3.8.0"></script>
  <script>
    initSupabase();
    let session, allUsers = [], allDepts = [], currentFilter = 'all';
    let editingUserId = null;

    const PAGE_FEATURES = [
      { id: 'admin-users', name: '사용자 관리', features: [
        { key: 'user_create', label: '사용자 등록' },
        { key: 'user_edit', label: '사용자 수정' },
        { key: 'user_delete', label: '사용자 삭제' },
        { key: 'user_pw_reset', label: '비밀번호 초기화' },
        { key: 'request_approve', label: '가입 신청 승인' },
        { key: 'request_reject', label: '가입 신청 거부' },
        { key: 'transfer_request', label: '부서 이동 요청' },
        { key: 'transfer_approve', label: '부서 이동 승인' }
      ]},
      { id: 'admin-departments', name: '부서 관리', features: [
        { key: 'dept_create', label: '부서 등록' },
        { key: 'dept_edit', label: '부서 수정' },
        { key: 'dept_delete', label: '부서 삭제' },
        { key: 'dept_view_members', label: '소속 보기' }
      ]},
      { id: 'admin-managers', name: '관리자 관리', features: [
        { key: 'mgr_register', label: '관리자 등록' },
        { key: 'mgr_edit', label: '관리자 수정' }
      ]},
      { id: 'admin-talents', name: '달란트 관리', features: [
        { key: 'talent_give', label: '달란트 지급' },
        { key: 'talent_use', label: '달란트 사용 처리' },
        { key: 'talent_view_detail', label: '상세 조회' }
      ]},
      { id: 'admin-shop', name: '물품 관리', features: [
        { key: 'product_create', label: '상품 등록' },
        { key: 'product_edit', label: '상품 수정' },
        { key: 'product_delete', label: '상품 삭제' },
        { key: 'product_toggle', label: '활성/비활성 전환' }
      ]},
      { id: 'admin-reports', name: '보고서', features: [
        { key: 'report_create', label: '보고서 등록' },
        { key: 'report_delete', label: '보고서 삭제' }
      ]},
      { id: 'admin-logs', name: '로그', features: [
        { key: 'log_delete', label: '로그 삭제' },
        { key: 'log_acknowledge', label: '로그 확인 처리' }
      ]},
      { id: 'admin-talent-items', name: '달란트 항목 관리', features: [
        { key: 'item_create', label: '항목 등록' },
        { key: 'item_edit', label: '항목 수정' },
        { key: 'item_delete', label: '항목 삭제' }
      ]},
      { id: 'admin-page-access', name: '페이지 접근 관리', features: [
        { key: 'access_edit', label: '접근 설정 수정' }
      ]},
      { id: 'admin-page-features', name: '페이지 기능 관리', features: [
        { key: 'feature_edit', label: '기능 설정 수정' }
      ]}
    ];

    (async () => {
      session = await initPage(80, '../login.html');
      if (!session) return;
      applyPermNav(session.permissionRank || 0);
      renderRoleBadge('navUser', session, '../');
      autoLogPageView();
      updatePendingBadge();

      const canEdit = session.permissionRank >= 90;
      if (!canEdit) document.getElementById('btnSaveFeature').style.display = 'none';

      const [usersRes, deptRes] = await Promise.all([fetchUsers(), fetchDepartments()]);
      allUsers = usersRes.data || [];
      allDepts = deptRes.data || [];
      renderTable();
    })();

    function getDeptName(id) {
      const d = allDepts.find(d => d.id === id);
      return d ? d.name : '-';
    }

    function filterUsers(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filters .filter-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      renderTable();
    }

    function renderTable() {
      const search = (document.getElementById('searchInput').value || '').toLowerCase();
      let list = allUsers;
      if (currentFilter !== 'all') list = list.filter(u => u.user_type === currentFilter);
      if (search) list = list.filter(u => (u.display_name || '').toLowerCase().includes(search) || (u.username || '').toLowerCase().includes(search));

      const tbody = document.getElementById('userList');
      document.getElementById('tableTitle').textContent = `사용자 목록 (${list.length}명)`;

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">사용자가 없습니다.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(u => {
        const typeLabel = TYPE_LABELS[u.user_type] || u.user_type;
        const permLabel = PERMISSION_LABELS[u.permission_level] || u.permission_level;
        const emoji = PERMISSION_EMOJI[u.permission_level] || '👤';
        return `<tr>
          <td>${typeLabel}</td>
          <td><span class="level-badge">${emoji} ${permLabel}</span></td>
          <td>${u.display_name || '-'}</td>
          <td>${getDeptName(u.department_id)}</td>
          <td><button class="filter-btn" onclick="openFeatureModal('${u.id}')">설정</button></td>
        </tr>`;
      }).join('');
    }

    async function openFeatureModal(userId) {
      editingUserId = userId;
      const user = allUsers.find(u => u.id === userId);
      if (!user) return;
      document.getElementById('featureTitle').textContent = `${user.display_name || user.username} - 페이지 기능 설정`;

      let saved = {};
      const { data } = await _sb.from('user_page_features').select('*').eq('user_id', userId);
      if (data) data.forEach(r => { saved[r.page_id] = r.features || {}; });

      const canEdit = session.permissionRank >= 90;
      const body = document.getElementById('featureBody');
      body.innerHTML = PAGE_FEATURES.map(p => {
        const userFeats = saved[p.id] || {};
        return `<div style="border:1px solid var(--admin-border);border-radius:8px;padding:0.8rem;margin-bottom:0.5rem;">
          <div style="font-weight:700;margin-bottom:0.5rem;">${p.name}</div>
          <div style="display:flex;flex-wrap:wrap;gap:0.6rem;">
            ${p.features.map(f => {
              const checked = userFeats[f.key] !== false;
              return `<label style="font-size:0.85rem;display:flex;align-items:center;gap:0.3rem;min-width:140px;">
                <input type="checkbox" data-page="${p.id}" data-feature="${f.key}" class="feat-check" ${checked ? 'checked' : ''} ${canEdit ? '' : 'disabled'} />
                ${f.label}
              </label>`;
            }).join('')}
          </div>
        </div>`;
      }).join('');

      document.getElementById('featureError').classList.remove('show');
      document.getElementById('featureModal').classList.remove('hidden');
    }

    function closeFeatureModal() { document.getElementById('featureModal').classList.add('hidden'); }

    async function saveFeatures() {
      if (!editingUserId) return;
      const errEl = document.getElementById('featureError');

      const rows = PAGE_FEATURES.map(p => {
        const features = {};
        document.querySelectorAll(`.feat-check[data-page="${p.id}"]`).forEach(cb => {
          features[cb.dataset.feature] = cb.checked;
        });
        return { user_id: editingUserId, page_id: p.id, features };
      });

      await _sb.from('user_page_features').delete().eq('user_id', editingUserId);
      const { error } = await _sb.from('user_page_features').insert(rows);
      if (error) {
        errEl.textContent = '저장 실패: ' + error.message;
        errEl.classList.add('show');
        return;
      }
      await logInfo('PAGE_FEATURE_UPDATE', { userId: editingUserId });
      closeFeatureModal();
      alert('저장되었습니다.');
    }

    document.getElementById('featureModal').addEventListener('click', e => { if (e.target.classList.contains('modal-overlay')) closeFeatureModal(); });
  </script>
  <script src="../js/version.js?v=3.8.0"></script>
</body>
</html>
