<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>부서 관리 대시보드 - CHO Talents</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="index.html" class="admin-nav-brand">CHO-Talents 부서관리</a>
    <ul class="admin-nav-links">
      <li><a href="../index.html">🏠 메인</a></li>
      <li><a href="index.html" class="active">대시보드</a></li>
      <li><a href="students.html">학생 관리</a></li>
      <li><a href="teachers.html">교사 관리</a></li>
      <li><a href="products.html">물품 관리</a></li>
      <li><a href="my-talents.html">내 달란트</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="doLogout()">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">부서 관리 대시보드</h2>
    <p style="color:var(--admin-text-muted);margin-bottom:1.5rem;" id="deptInfo"></p>

    <div class="cards-grid">
      <div class="stat-card">
        <div class="stat-card-label">담당 학생수</div>
        <div class="stat-card-value" id="studentCount">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">담당 교사수</div>
        <div class="stat-card-value" id="teacherCount">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">등록 상품수</div>
        <div class="stat-card-value" id="productCount">-</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">현재 시간 (KST)</div>
        <div class="stat-card-value" id="kstClock" style="font-size:1.2rem;">-</div>
      </div>
    </div>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title">빠른 바로가기</div>
      </div>
      <div style="padding:1.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;">
        <a href="students.html" style="display:block;padding:1.2rem;background:#f3f0ff;border-radius:12px;text-decoration:none;text-align:center;">
          <div style="font-size:2rem;">👨‍🎓</div>
          <div style="font-weight:700;color:var(--admin-primary);margin-top:0.3rem;">학생 관리</div>
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">계정 등록 · 달란트 관리</div>
        </a>
        <a href="teachers.html" style="display:block;padding:1.2rem;background:#f0fff4;border-radius:12px;text-decoration:none;text-align:center;">
          <div style="font-size:2rem;">👩‍🏫</div>
          <div style="font-weight:700;color:#2b8a3e;margin-top:0.3rem;">교사 관리</div>
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">계정 등록 · 달란트 관리</div>
        </a>
        <a href="products.html" style="display:block;padding:1.2rem;background:#fff5f5;border-radius:12px;text-decoration:none;text-align:center;">
          <div style="font-size:2rem;">🛒</div>
          <div style="font-weight:700;color:#e03131;margin-top:0.3rem;">물품 관리</div>
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">상품 등록 · 수정 · 삭제</div>
        </a>
        <a href="my-talents.html" style="display:block;padding:1.2rem;background:#fff9db;border-radius:12px;text-decoration:none;text-align:center;">
          <div style="font-size:2rem;">⭐</div>
          <div style="font-weight:700;color:#e67700;margin-top:0.3rem;">내 달란트</div>
          <div style="font-size:0.8rem;color:var(--admin-text-muted);">적립 · 사용 · 잔여 조회</div>
        </a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/activity-log.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/user-mgmt.js"></script>
  <script>
    initSupabase();
    const session = requireRole(['dept_manager', 'admin'], '../login.html');

    function doLogout() { logout('../login.html'); }

    if (session) {
      document.getElementById('navUser').textContent = session.displayName || session.username;
      document.getElementById('deptInfo').textContent =
        session.departmentName ? `담당 부서: ${session.departmentName}` : '담당 부서 미배정';
      autoLogPageView();
      loadDashboard();
    }

    function updateClock() { document.getElementById('kstClock').textContent = formatKST(); }
    updateClock();
    setInterval(updateClock, 1000);

    async function loadDashboard() {
      const deptId = session.managedDeptId;
      const isAdmin = session.role === 'admin';

      const [studentsRes, teachersRes, productsRes] = await Promise.all([
        isAdmin
          ? _sb.from('admin_users').select('*', { count: 'exact', head: true }).eq('role', 'student')
          : _sb.from('admin_users').select('*', { count: 'exact', head: true }).eq('role', 'student').eq('department_id', deptId),
        isAdmin
          ? _sb.from('admin_users').select('*', { count: 'exact', head: true }).eq('role', 'teacher')
          : _sb.from('admin_users').select('*', { count: 'exact', head: true }).eq('role', 'teacher').eq('department_id', deptId),
        _sb.from('products').select('*', { count: 'exact', head: true }).eq('is_active', true)
      ]);

      document.getElementById('studentCount').textContent = studentsRes.count || 0;
      document.getElementById('teacherCount').textContent = teachersRes.count || 0;
      document.getElementById('productCount').textContent = productsRes.count || 0;
    }
  </script>
</body>
</html>
