<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>물품 관리 - 부서 관리</title>
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-body">
  <nav class="admin-nav">
    <a href="index.html" class="admin-nav-brand">CHO-Talents 부서관리</a>
    <ul class="admin-nav-links">
      <li><a href="../index.html">🏠 메인</a></li>
      <li><a href="index.html">대시보드</a></li>
      <li><a href="students.html">학생 관리</a></li>
      <li><a href="teachers.html">교사 관리</a></li>
      <li><a href="products.html" class="active">물품 관리</a></li>
      <li><a href="my-talents.html">내 달란트</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-logout" onclick="logout('../login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="admin-container">
    <h2 style="margin-bottom:1rem;">물품 관리</h2>

    <div class="admin-table-wrap">
      <div class="admin-table-header">
        <div class="admin-table-title" id="tableTitle">상품 목록</div>
        <div class="filters">
          <button class="filter-btn active" onclick="filterRole('all',this)">전체</button>
          <button class="filter-btn" onclick="filterRole('student',this)">학생용</button>
          <button class="filter-btn" onclick="filterRole('teacher',this)">교사용</button>
          <span style="margin-left:0.5rem;"></span>
          <button class="filter-btn" style="background:var(--admin-primary);color:#fff;" onclick="openAddModal()">+ 상품 등록</button>
        </div>
      </div>
      <table class="admin-table">
        <thead><tr><th></th><th>상품명</th><th>대상</th><th>카테고리</th><th>가격</th><th>재고</th><th>관리</th></tr></thead>
        <tbody id="productList"><tr><td colspan="7" class="empty-state">로딩 중...</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay hidden" id="productModal">
    <div class="modal-box" style="max-width:480px;">
      <h3 class="modal-title" id="modalTitle">상품 등록</h3>
      <div class="form-error" id="modalError"></div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">상품명</label>
        <input type="text" id="mName" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
      </div>
      <div style="display:flex;gap:0.8rem;margin-bottom:0.8rem;">
        <div style="flex:1;">
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">대상</label>
          <select id="mTarget" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;">
            <option value="student">학생</option>
            <option value="teacher">교사</option>
          </select>
        </div>
        <div style="flex:1;">
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">카테고리</label>
          <input type="text" id="mCategory" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" placeholder="예: 학용품" />
        </div>
      </div>
      <div style="display:flex;gap:0.8rem;margin-bottom:0.8rem;">
        <div style="flex:1;">
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">가격 (달란트)</label>
          <input type="number" id="mPrice" min="1" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
        </div>
        <div style="flex:1;">
          <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">재고</label>
          <input type="number" id="mStock" min="0" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" />
        </div>
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">이모지</label>
        <input type="text" id="mEmoji" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;" placeholder="🎁" />
      </div>
      <div style="margin-bottom:0.8rem;">
        <label style="font-weight:600;font-size:0.85rem;display:block;margin-bottom:0.3rem;">설명</label>
        <textarea id="mDesc" style="width:100%;min-height:60px;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;resize:vertical;"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-confirm" onclick="saveProduct()">저장</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script src="../js/activity-log.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/product.js"></script>
  <script>
    initSupabase();
    const session = requireRole(['dept_manager', 'admin'], '../login.html');
    let allProducts = [];
    let editingId = null;
    let currentFilter = 'all';

    if (session) {
      document.getElementById('navUser').textContent = session.displayName || session.username;
      autoLogPageView();
      loadProducts();
    }

    async function loadProducts() {
      const { data } = await fetchProducts(null, { activeOnly: false });
      allProducts = data || [];
      renderProducts();
    }

    function filterRole(role, btn) {
      currentFilter = role;
      document.querySelectorAll('.admin-table-header .filter-btn:not([style*="background:var(--admin-primary)"])').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    }

    function renderProducts() {
      const list = currentFilter === 'all' ? allProducts : allProducts.filter(p => p.target_role === currentFilter);
      const tbody = document.getElementById('productList');
      document.getElementById('tableTitle').textContent = `상품 목록 (${list.length}건)`;

      if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="7" class="empty-state">등록된 상품이 없습니다.</td></tr>'; return; }

      tbody.innerHTML = list.map(p => `<tr${!p.is_active ? ' style="opacity:0.5;"' : ''}>
        <td style="font-size:1.5rem;">${p.image_emoji || '🎁'}</td>
        <td><strong>${p.name}</strong><br><small style="color:var(--admin-text-muted);">${p.description || ''}</small></td>
        <td><span class="level-badge ${p.target_role === 'student' ? 'INFO' : 'WARN'}">${p.target_role === 'student' ? '학생' : '교사'}</span></td>
        <td>${p.category || '-'}</td>
        <td style="font-weight:700;">${p.price}</td>
        <td>${p.stock}</td>
        <td>
          <button class="filter-btn" onclick='openEditModal(${JSON.stringify(p).replace(/'/g,"&#39;")})'>수정</button>
          <button class="btn-ack" onclick="confirmDelete('${p.id}','${p.name}')">삭제</button>
        </td>
      </tr>`).join('');
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '상품 등록';
      document.getElementById('mName').value = '';
      document.getElementById('mTarget').value = 'student';
      document.getElementById('mCategory').value = '';
      document.getElementById('mPrice').value = '';
      document.getElementById('mStock').value = '0';
      document.getElementById('mEmoji').value = '';
      document.getElementById('mDesc').value = '';
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('productModal').classList.remove('hidden');
    }

    function openEditModal(p) {
      editingId = p.id;
      document.getElementById('modalTitle').textContent = '상품 수정';
      document.getElementById('mName').value = p.name;
      document.getElementById('mTarget').value = p.target_role;
      document.getElementById('mCategory').value = p.category || '';
      document.getElementById('mPrice').value = p.price;
      document.getElementById('mStock').value = p.stock;
      document.getElementById('mEmoji').value = p.image_emoji || '';
      document.getElementById('mDesc').value = p.description || '';
      document.getElementById('modalError').classList.remove('show');
      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeModal() { document.getElementById('productModal').classList.add('hidden'); }

    async function saveProduct() {
      const errEl = document.getElementById('modalError');
      const name = document.getElementById('mName').value.trim();
      const price = parseInt(document.getElementById('mPrice').value);

      if (!name) { errEl.textContent = '상품명을 입력해주세요.'; errEl.classList.add('show'); return; }
      if (!price || price <= 0) { errEl.textContent = '유효한 가격을 입력해주세요.'; errEl.classList.add('show'); return; }

      const row = {
        name,
        target_role: document.getElementById('mTarget').value,
        category: document.getElementById('mCategory').value.trim() || null,
        price,
        stock: parseInt(document.getElementById('mStock').value) || 0,
        image_emoji: document.getElementById('mEmoji').value.trim() || '🎁',
        description: document.getElementById('mDesc').value.trim() || null
      };

      if (editingId) {
        const { error } = await updateProduct(editingId, row);
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      } else {
        row.created_by = session.id;
        const { error } = await createProduct(row);
        if (error) { errEl.textContent = error; errEl.classList.add('show'); return; }
      }
      closeModal();
      await loadProducts();
    }

    async function confirmDelete(id, name) {
      if (!confirm(`"${name}" 상품을 삭제하시겠습니까?`)) return;
      await deleteProduct(id);
      await loadProducts();
    }

    document.getElementById('productModal').addEventListener('click', e => { if(e.target.classList.contains('modal-overlay')) closeModal(); });
  </script>
</body>
</html>
