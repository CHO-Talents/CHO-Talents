<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계정 등록 신청 - 달란트 마을</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
  <link rel="stylesheet" href="css/admin.css" />
  <style>
    .login-wrapper { background: linear-gradient(135deg, #f8f5ff 0%, #e0f7fa 50%, #e8f5e9 100%); }
    .login-card { max-width: 460px; }
    .login-title { font-size: 1.5rem; }
    .back-link { display: block; text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--admin-primary); text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
    .role-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 0.3rem; }
    .role-card {
      border: 2px solid var(--admin-border); border-radius: 12px; padding: 0.8rem 0.5rem;
      text-align: center; cursor: pointer; transition: all 0.2s; background: #fff;
    }
    .role-card:hover { border-color: var(--admin-primary); }
    .role-card.selected { border-color: var(--admin-primary); background: rgba(108,92,231,0.06); }
    .role-card .rc-emoji { font-size: 1.5rem; display: block; margin-bottom: 0.2rem; }
    .role-card .rc-label { font-size: 0.82rem; font-weight: 700; color: #2d3436; }
    .result-box { text-align: center; padding: 1.5rem; }
    .result-box .r-icon { font-size: 3rem; margin-bottom: 0.5rem; }
    .result-box h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .result-box p { color: #636e72; font-size: 0.9rem; line-height: 1.6; }
  </style>
</head>
<body class="admin-body">
  <div class="login-wrapper">
    <div class="login-card">
      <div style="text-align:center;font-size:2.5rem;margin-bottom:0.5rem;">📝</div>
      <div class="login-title">계정 등록 신청</div>
      <p class="login-sub">정보를 입력하면 관리자 승인 후 사용할 수 있어요</p>

      <div id="formArea">
        <div class="form-error" id="errorMsg"></div>

        <div class="form-group">
          <label>희망 아이디</label>
          <input type="text" id="rUsername" placeholder="영문, 숫자 조합" />
        </div>
        <div class="form-group">
          <label>이름</label>
          <input type="text" id="rDisplayName" placeholder="실명을 입력해주세요" />
        </div>

        <div class="form-group">
          <label>역할 선택</label>
          <div class="role-cards" id="roleCards">
            <div class="role-card selected" data-role="student" onclick="selectRole(this)">
              <span class="rc-emoji">🎒</span>
              <span class="rc-label">학생</span>
            </div>
            <div class="role-card" data-role="teacher" onclick="selectRole(this)">
              <span class="rc-emoji">👩‍🏫</span>
              <span class="rc-label">교사</span>
            </div>
            <div class="role-card" data-role="dept_manager" onclick="selectRole(this)">
              <span class="rc-emoji">📋</span>
              <span class="rc-label">부서 관리자</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label>소속 부서 <span style="color:#e03131;">*필수</span></label>
          <select id="rDept" style="width:100%;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;">
            <option value="">부서를 선택해주세요</option>
          </select>
        </div>

        <div class="form-group">
          <label>신청 사유 (선택)</label>
          <textarea id="rReason" style="width:100%;min-height:60px;padding:0.6rem;border:1px solid var(--admin-border);border-radius:8px;resize:vertical;" placeholder="간단히 작성해주세요"></textarea>
        </div>

        <button class="btn-primary" id="btnSubmit" onclick="submitRequest()">신청하기</button>
      </div>

      <div id="resultArea" style="display:none;">
        <div class="result-box">
          <div class="r-icon">✅</div>
          <h3>신청이 완료되었어요!</h3>
          <p>관리자가 신청 내용을 확인한 후<br/>승인이 되면 로그인할 수 있어요.<br/>초기 비밀번호는 <strong>1234</strong>입니다.</p>
        </div>
      </div>

      <a href="login.html" class="back-link">← 로그인 페이지로 돌아가기</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/activity-log.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initSupabase();
    autoLogPageView();
    let selectedRole = 'student';

    loadDepts();

    async function loadDepts() {
      const { data } = await _sb.from('departments').select('id, name').eq('is_active', true).order('name');
      const sel = document.getElementById('rDept');
      (data || []).forEach(d => {
        sel.innerHTML += `<option value="${d.id}">${d.name}</option>`;
      });
    }

    function selectRole(el) {
      document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      selectedRole = el.dataset.role;
    }

    async function submitRequest() {
      const errEl = document.getElementById('errorMsg');
      errEl.classList.remove('show');
      const username = document.getElementById('rUsername').value.trim();
      const displayName = document.getElementById('rDisplayName').value.trim();
      const deptId = document.getElementById('rDept').value;
      const reason = document.getElementById('rReason').value.trim();

      if (!username) { errEl.textContent = '아이디를 입력해주세요.'; errEl.classList.add('show'); return; }
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) { errEl.textContent = '아이디는 3~20자 영문, 숫자, _만 가능합니다.'; errEl.classList.add('show'); return; }
      if (!displayName) { errEl.textContent = '이름을 입력해주세요.'; errEl.classList.add('show'); return; }
      if (!deptId) { errEl.textContent = '소속 부서를 선택해주세요.'; errEl.classList.add('show'); return; }

      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = '신청 중...';

      const { data: existing } = await _sb.from('admin_users').select('id').eq('username', username);
      if (existing && existing.length > 0) {
        errEl.textContent = '이미 사용 중인 아이디입니다.'; errEl.classList.add('show');
        btn.disabled = false; btn.textContent = '신청하기'; return;
      }

      const { data: pendingReq } = await _sb.from('registration_requests').select('id').eq('username', username).eq('status', 'pending');
      if (pendingReq && pendingReq.length > 0) {
        errEl.textContent = '이미 신청 중인 아이디입니다. 승인을 기다려주세요.'; errEl.classList.add('show');
        btn.disabled = false; btn.textContent = '신청하기'; return;
      }

      const { error } = await _sb.from('registration_requests').insert({
        username, display_name: displayName, role: selectedRole,
        department_id: deptId, reason: reason || null
      });

      if (error) {
        errEl.textContent = '신청 중 오류가 발생했습니다: ' + error.message; errEl.classList.add('show');
        btn.disabled = false; btn.textContent = '신청하기'; return;
      }

      await logInfo('REGISTER_REQUEST', { username, role: selectedRole });
      document.getElementById('formArea').style.display = 'none';
      document.getElementById('resultArea').style.display = 'block';
    }
  </script>
  <script src="js/version.js"></script>
</body>
</html>
