<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달란트 상점 - 달란트 마을</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
  <link rel="stylesheet" href="css/common.css" />
</head>
<body class="page-body">
  <nav class="top-nav">
    <a href="index.html" class="top-nav-brand">
      <span class="brand-icon">⭐</span> 달란트 마을
    </a>
    <ul class="top-nav-links" id="navLinks">
      <li><a href="earn-talents.html">달란트 적립</a></li>
      <li><a href="shop.html" class="active">상품 구매</a></li>
      <li id="navMyTalent" style="display:none;"><a href="my-talents.html">내 달란트</a></li>
      <li data-min-perm="60" style="display:none;"><a href="admin/users.html">사용자 관리</a></li>
      <li data-min-perm="40" style="display:none;"><a href="admin/talents.html">달란트 관리</a></li>
      <li data-min-perm="60" style="display:none;"><a href="admin/shop.html">물품 관리</a></li>
      <li data-min-perm="80" style="display:none;"><a href="admin/index.html">대시보드</a></li>
      <li id="navAuthArea"><a href="login.html">로그인</a></li>
    </ul>
  </nav>

  <div class="page-container">
    <h1 class="page-title">🛒 달란트 상점</h1>
    <p class="page-sub" id="shopSub">달란트로 교환할 수 있는 상품들이에요!</p>

    <div id="tabArea" style="display:none;margin-bottom:1.5rem;gap:0.5rem;">
      <button class="filter-btn active" id="tabStudent" onclick="switchShopTab('student')">🎒 학생용</button>
      <button class="filter-btn" id="tabTeacher" onclick="switchShopTab('teacher')">👩‍🏫 교사용</button>
    </div>

    <div id="productArea">
      <div class="empty-state">
        <div class="empty-state-icon">⏳</div>
        <p>상품을 불러오는 중...</p>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    <p>초등부 달란트 관리 &copy; 2026 CHO-Talents</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=3.7.5"></script>
  <script src="js/activity-log.js?v=3.7.5"></script>
  <script src="js/auth.js?v=3.7.5"></script>
  <script src="js/product.js"></script>
  <script>
    initSupabase();
    let currentShopTab = 'student';
    let allShopProducts = [];

    let _canViewTeacher = false;

    (async () => {
      const session = await loadAuthSession();
      if (session) {
        document.getElementById('navMyTalent').style.display = '';
        document.getElementById('navAuthArea').innerHTML =
          `<span class="nav-user" id="navUser"></span></li>` +
          `<li><button class="btn-nav-logout" onclick="logout('login.html')">로그아웃</button>`;
        renderRoleBadge('navUser', session, '');
        applyPermNav(session.permissionRank || 0);
        document.querySelectorAll('[data-min-perm]').forEach(el => {
          const minP = parseInt(el.dataset.minPerm, 10);
          if ((session.permissionRank || 0) >= minP) el.style.display = '';
        });

        _canViewTeacher = session.userType === 'teacher' || (session.permissionRank || 0) >= 60;
        currentShopTab = _canViewTeacher ? (session.userType || 'student') : 'student';
        if (_canViewTeacher) {
          document.getElementById('tabArea').style.display = 'flex';
        }
      }
      autoLogPageView();
      loadAllProducts();
    })();

    async function loadAllProducts() {
      let query = _sb.from('products').select('*').eq('is_active', true);
      if (!_canViewTeacher) {
        query = query.eq('target_role', 'student');
      }
      const { data, error } = await query.order('created_at', { ascending: false });
      allShopProducts = data || [];
      renderShopProducts();
    }

    function switchShopTab(tab) {
      currentShopTab = tab;
      document.getElementById('tabStudent').classList.toggle('active', tab === 'student');
      document.getElementById('tabTeacher').classList.toggle('active', tab === 'teacher');
      renderShopProducts();
    }

    function renderShopProducts() {
      const filtered = allShopProducts.filter(p => p.target_role === currentShopTab);
      const area = document.getElementById('productArea');
      const label = currentShopTab === 'student' ? '학생' : '교사';
      document.getElementById('shopSub').textContent = `${label} 달란트 교환 상품입니다`;

      if (filtered.length === 0) {
        area.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📦</div><p>등록된 상품이 없습니다.</p></div>';
        return;
      }

      if (currentShopTab === 'teacher') {
        const categories = {};
        filtered.forEach(p => { const cat = p.category || '기타'; if (!categories[cat]) categories[cat] = []; categories[cat].push(p); });
        let html = '';
        for (const [cat, items] of Object.entries(categories)) {
          html += `<h2 class="section-title">${cat}</h2><div class="product-grid">`;
          html += items.map(p => renderProductCard(p)).join('');
          html += '</div>';
        }
        area.innerHTML = html;
      } else {
        area.innerHTML = '<div class="product-grid">' + filtered.map(p => renderProductCard(p)).join('') + '</div>';
      }
    }

    function renderProductCard(p) {
      return `<div class="product-card">
        ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}" class="product-img" />` : `<span class="product-emoji">${p.image_emoji || '🎁'}</span>`}
        <div class="product-name">${p.name}</div>
        <div class="product-price">${p.price} <span class="unit">달란트</span></div>
        <div class="product-desc">${p.description || ''}</div>
        <div class="product-stock ${p.stock <= 5 ? 'low' : ''}">재고: ${p.stock}개 ${p.stock <= 5 ? '(품절 임박!)' : ''}</div>
      </div>`;
    }
  </script>
  <script src="js/version.js?v=3.7.5"></script>
</body>
</html>
