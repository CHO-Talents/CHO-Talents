    function formatKSTShort(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

    async function cancelOrder(orderId, productName, price) {
      if (!confirm(`"${productName}" 援щℓ瑜?痍⑥냼?섏떆寃좎뒿?덇퉴?\n${fmtNum(price)} ?щ??멸? 蹂듭썝?⑸땲??`)) return;
      try {
        const { error: updateErr } = await _sb.from('product_orders').update({ status: 'cancelled' }).eq('id', orderId).eq('status', 'requested');
        if (updateErr) { alert(tErr(updateErr.message)); return; }
        const { error: balErr } = await _sb.from('profiles').update({ pending_talent: (session.pendingTalent || 0) - price }).eq('id', session.id);
        if (balErr) console.warn('pending_talent restore failed:', balErr);

        alert('援щℓ媛 痍⑥냼?섏뿀?듬땲??');

        alert('痍⑥냼 泥섎━ 以??ㅻ쪟: ' + tErr(err.message));
      }
    }

    async function loadOrders() {
      const main = document.getElementById('mainContent');
      let orders = [];
      try {
        const { data, error } = await _sb.from('product_orders').select('*').eq('user_id', session.id).order('created_at', { ascending: false });

              <td>${formatKSTShort(o.requested_at || o.created_at)}</td>
