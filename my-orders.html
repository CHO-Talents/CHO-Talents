<!DOCTYPE html>
<html lang="ko" data-theme="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 구매 상품 - 달란트 마을</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>" />
  <link rel="stylesheet" href="css/themes.css?v=3.35.0" />
  <link rel="stylesheet" href="css/common.css?v=3.35.0" />
</head>
<body class="page-body">
  <div id="nav-container"></div>


  <div class="page-container" id="mainContent">
    <div class="empty-state"><div class="empty-state-icon">⏳</div><p>로딩 중...</p></div>
  </div>

  <footer class="page-footer">
    <p>초등부 달란트 관리 &copy; 2026 CHO-Talents</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config/public-config.js?v=3.35.0"></script>
  <script src="js/supabase-config.js?v=3.35.0"></script>
  <script src="js/activity-log.js?v=3.35.0"></script>
  <script src="js/auth.js?v=3.35.0"></script>
  <script src="js/theme.js?v=3.35.0"></script>
  <script src="js/nav.js?v=3.35.0"></script>
  <script>
    initSupabase();
    let session;

    function formatKSTShort(isoStr) {
      if (!isoStr) return '-';
      const d = new Date(isoStr);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    (async () => {
      await navInit();
      session = await initPage(20, 'login.html');
      if (!session) return;
      navUpdateAuth(session);
      autoLogPageView();
      updateNavOrderBadge();
      await loadOrders();
    })();

    async function loadOrders() {
      const main = document.getElementById('mainContent');
      let orders = [];
      try {
        const { data, error } = await _sb.from('product_orders').select('*').eq('user_id', session.id).order('created_at', { ascending: false });
        if (error) { logWarn('MY_ORDERS_FETCH', { 오류: error.message }); }
        else { orders = data || []; }
      } catch (e) { /* table may not exist */ }

      orders = (orders || []).filter(o => o.status !== 'cancelled');
      const statusMap = { requested:'구매 신청', preparing:'상품 준비', purchased:'상품 구매', delivered:'상품 지급' };
      const statusColor = { requested:'#868e96', preparing:'#e67700', purchased:'#1971c2', delivered:'#2b8a3e' };
      const statusEmoji = { requested:'🛒', preparing:'📦', purchased:'💳', delivered:'✅' };

      let html = `<h1 class="page-title">🛒 내 구매 상품</h1>
        <p class="page-sub">${session.displayName || session.username}님의 구매 내역입니다</p>`;

      if (orders.length === 0) {
        html += '<div class="empty-state"><div class="empty-state-icon">📦</div><p>구매 내역이 없습니다.</p></div>';
      } else {
        html += `<div class="data-table-wrap">
          <div class="data-table-header"><div class="data-table-title">구매 내역 (${orders.length}건)</div></div>
          <table class="data-table">
            <thead><tr><th>날짜</th><th>상품명</th><th>가격</th><th>현재 상태</th></tr></thead>
            <tbody>` + orders.map(o => `<tr>
              <td>${formatKSTShort(o.requested_at || o.created_at)}</td>
              <td>${o.product_name || '-'}</td>
              <td style="font-weight:700;">${fmtNum(o.price)} 달란트</td>
              <td>
                <span style="display:inline-flex;align-items:center;gap:0.3rem;padding:0.2rem 0.6rem;border-radius:6px;font-size:0.82rem;font-weight:600;background:${statusColor[o.status]||'#868e96'}15;color:${statusColor[o.status]||'#868e96'};">${statusEmoji[o.status]||''} ${statusMap[o.status]||o.status}</span>
                ${o.status === 'requested' ? `<button onclick="cancelOrder('${o.id}','${(o.product_name||'').replace(/'/g,"\\'")}',${o.price})" style="margin-left:0.4rem;padding:0.15rem 0.5rem;font-size:0.75rem;border:1px solid #e03131;color:#e03131;background:#fff;border-radius:4px;cursor:pointer;">\ucde8\uc18c</button>` : ''}
              </td>
            </tr>`).join('') + '</tbody></table></div>';
      }

      main.innerHTML = html;
    }

    async function cancelOrder(orderId, productName, price) {
      if (!confirm(`"${productName}" 구매를 취소하시겠습니까?\n${price} 달란트가 복원됩니다.`)) return;
      try {
        const { error: upErr } = await _sb.from('product_orders').update({ status: 'cancelled' }).eq('id', orderId).eq('user_id', session.id).eq('status', 'requested');
        if (upErr) throw upErr;
        const { data: prof } = await _sb.from('profiles').select('pending_talent').eq('id', session.id).single();
        const newPending = Math.max(0, ((prof && prof.pending_talent) || 0) - price);
        await _sb.from('profiles').update({ pending_talent: newPending }).eq('id', session.id);
        await logInfo('ORDER_CANCEL', { orderId, 상품명: productName, 금액: price });
        alert('구매가 취소되었습니다.');
        await loadOrders();
      } catch (e) {
        alert('취소 실패: ' + (e.message || e));
      }
    }
  </script>
  <script src="js/version.js?v=3.35.0"></script>
</body>
</html>
