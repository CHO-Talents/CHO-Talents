<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달란트 마을 - CHO Talents</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="falling-stars" id="fallingStars"></div>

  <header class="header">
    <div class="logo">
      <span class="logo-icon">⭐</span>
      <span class="logo-text">달란트 마을</span>
      <nav class="main-nav" id="mainNav">
        <a href="shop.html" class="nav-btn">🛒 달란트 상점</a>
        <a href="login.html" class="nav-btn" id="navLoginBtn">🔑 로그인</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="hero">
      <div class="hero-badge">CHO Talents</div>
      <h1 class="hero-title">
        <span class="wave-text" style="--i:0">달</span><span class="wave-text" style="--i:1">란</span><span class="wave-text" style="--i:2">트</span>
        <span class="wave-text space" style="--i:3">&nbsp;</span>
        <span class="wave-text" style="--i:4">마</span><span class="wave-text" style="--i:5">을</span><span class="wave-text" style="--i:6">에</span>
        <br />
        <span class="wave-text" style="--i:7">오</span><span class="wave-text" style="--i:8">신</span>
        <span class="wave-text space" style="--i:9">&nbsp;</span>
        <span class="wave-text" style="--i:10">것</span><span class="wave-text" style="--i:11">을</span>
        <br />
        <span class="wave-text highlight" style="--i:12">환</span><span class="wave-text highlight" style="--i:13">영</span><span class="wave-text highlight" style="--i:14">해</span><span class="wave-text highlight" style="--i:15">요</span><span class="wave-text highlight" style="--i:16">!</span>
      </h1>
      <p class="hero-sub">우리 함께 달란트를 모아볼까요?</p>

      <div class="mascots">
        <div class="mascot bounce-1">🌟</div>
        <div class="mascot bounce-2">🎁</div>
        <div class="mascot bounce-3">🏆</div>
      </div>

      <div class="feature-cards">
        <a href="earn-talents.html" class="card card-talent">
          <div class="card-icon">💰</div>
          <h3>달란트 적립</h3>
          <p>열심히 활동하고<br/>달란트를 모아요!</p>
        </a>
        <a href="shop.html" class="card card-shop">
          <div class="card-icon">🛒</div>
          <h3>상품 구매</h3>
          <p>모은 달란트로<br/>원하는 상품을 골라요!</p>
        </a>
        <a href="my-talents.html" class="card card-rank" id="cardMyTalent">
          <div class="card-icon">🏅</div>
          <h3>내 달란트</h3>
          <p>내가 모은 달란트를<br/>확인해 봐요!</p>
        </a>
      </div>

      <div class="status-box" id="statusBox">
        <div class="status-icon">🔗</div>
        <div class="status-text">
          <span class="status-label">서버 연결 상태</span>
          <span class="status-value" id="statusValue">확인 중...</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>초등부 달란트 관리 &copy; 2026 CHO-Talents</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=3.5.0"></script>
  <script src="js/activity-log.js?v=3.5.0"></script>
  <script src="js/auth.js?v=3.5.0"></script>
  <script src="js/app.js"></script>
  <script>
    (async () => {
      const s = await loadAuthSession();
      if (s) {
        const nav = document.getElementById('mainNav');
        const dashHref = getRoleRedirectUrl(s.permissionLevel, '');
        nav.innerHTML =
          `<a href="shop.html" class="nav-btn">\u{1F6D2} 달란트 상점</a>` +
          `<div class="nav-user-info">` +
            `<a href="${dashHref}" class="nav-user-name">\u{1F464} ${s.displayName || s.username}</a>` +
            `<button class="btn-nav-logout" onclick="logout('login.html')">로그아웃</button>` +
          `</div>`;

        const myTalentCard = document.getElementById('cardMyTalent');
        if (myTalentCard) {
          const rank = s.permissionRank || 0;
          myTalentCard.href = rank >= 80 ? 'admin/index.html'
            : rank >= 60 ? 'admin/talents.html'
            : 'my-talents.html';
        }
      }
    })();
  </script>
  <script src="js/version.js?v=3.5.0"></script>
</body>
</html>
