<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>내 달란트 - 달란트 마을</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>" />
  <link rel="stylesheet" href="css/common.css" />
</head>
<body class="page-body">
  <nav class="top-nav">
    <a href="index.html" class="top-nav-brand">
      <span class="brand-icon">⭐</span> 달란트 마을
    </a>
    <ul class="top-nav-links">
      <li><a href="earn-talents.html">달란트 적립</a></li>
      <li><a href="shop.html">상품 구매</a></li>
      <li><a href="my-talents.html" class="active">내 달란트</a></li>
      <li data-min-perm="60"><a href="admin/users.html">사용자 관리</a></li>
      <li data-min-perm="40"><a href="admin/talents.html">달란트 관리</a></li>
      <li data-min-perm="60"><a href="admin/shop.html">상품 관리</a></li>
      <li data-min-perm="80"><a href="admin/index.html">대시보드</a></li>
      <li><span class="nav-user" id="navUser"></span></li>
      <li><button class="btn-nav-logout" onclick="logout('login.html')">로그아웃</button></li>
    </ul>
  </nav>

  <div class="page-container" id="mainContent"></div>

  <footer class="page-footer">
    <p>초등부 달란트 관리 &copy; 2026 CHO-Talents</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=3.10.0"></script>
  <script src="js/activity-log.js?v=3.10.0"></script>
  <script src="js/auth.js?v=3.10.0"></script>
  <script src="js/talent.js"></script>
  <script>
    initSupabase();
    let session;
    (async () => {
      session = await initPage(20, 'login.html');
      if (!session) return;

      applyPermNav(session.permissionRank || 0);
      renderRoleBadge('navUser', session, '');
      autoLogPageView();
      loadMyTalents();
    })();

    async function loadMyTalents() {
      const main = document.getElementById('mainContent');
      const summary = await fetchTalentSummary(session.id);
      let pendingTalent = 0;
      try {
        const { data: prof, error: profErr } = await _sb.from('profiles').select('pending_talent').eq('id', session.id).single();
        if (profErr) {
          const msg = profErr.message || '';
          if (!msg.includes('does not exist')) logWarn('MY_TALENT_PENDING_QUERY', { error: msg });
        } else {
          pendingTalent = (prof && prof.pending_talent) || 0;
        }
      } catch (e) { /* pending_talent column may not exist */ }
      const available = summary.balance - pendingTalent;
      const { data: history } = await fetchTalentHistory(session.id, { limit: 50 });

      let html = `
        <h1 class="page-title">💰 내 달란트</h1>
        <p class="page-sub">${session.displayName || session.username}님의 달란트 현황</p>
        <div class="summary-cards">
          <div class="summary-card earn">
            <div class="summary-card-icon">📈</div>
            <div class="summary-card-label">누적 적립</div>
            <div class="summary-card-value">${summary.earned}</div>
          </div>
          <div class="summary-card use">
            <div class="summary-card-icon">📉</div>
            <div class="summary-card-label">사용 완료</div>
            <div class="summary-card-value">${summary.used}</div>
          </div>
          ${pendingTalent > 0 ? `<div class="summary-card" style="background:#fff3bf;">
            <div class="summary-card-icon">⏳</div>
            <div class="summary-card-label">사용 대기</div>
            <div class="summary-card-value" style="color:#e67700;">${pendingTalent}</div>
          </div>` : ''}
          <div class="summary-card balance">
            <div class="summary-card-icon">⭐</div>
            <div class="summary-card-label">사용 가능</div>
            <div class="summary-card-value">${available}</div>
          </div>
        </div>
        <div class="data-table-wrap">
          <div class="data-table-header"><div class="data-table-title">달란트 내역</div></div>
          <table class="data-table">
            <thead><tr><th>날짜</th><th>유형</th><th>금액</th><th>설명</th><th>잔액</th></tr></thead>
            <tbody>`;

      if (!history || history.length === 0) {
        html += '<tr><td colspan="5" class="empty-state">아직 달란트 내역이 없습니다.</td></tr>';
      } else {
        html += history.map(t => `
          <tr>
            <td>${formatKSTShort(t.created_at)}</td>
            <td><span class="type-badge ${t.type}">${t.type === 'earn' ? '적립' : '사용'}</span></td>
            <td style="font-weight:700;color:${t.type === 'earn' ? '#2b8a3e' : '#e03131'}">${t.type === 'earn' ? '+' : '-'}${t.amount}</td>
            <td>${t.description || '-'}</td>
            <td>${t.balance_after}</td>
          </tr>`).join('');
      }

      html += '</tbody></table></div>';

      let orders = null;
      try {
        const { data: od, error: odErr } = await _sb.from('product_orders').select('*').eq('user_id', session.id).order('created_at', { ascending: false }).limit(20);
        if (odErr) { logWarn('MY_TALENT_ORDERS_QUERY', { error: odErr.message }); }
        else { orders = od; }
      } catch (e) { /* product_orders table may not exist */ }
      if (orders && orders.length > 0) {
        const statusMap = { requested:'구매 신청', preparing:'상품 준비', purchased:'상품 구매', delivered:'상품 지급' };
        const statusColor = { requested:'#868e96', preparing:'#e67700', purchased:'#1971c2', delivered:'#2b8a3e' };
        html += `<div class="data-table-wrap" style="margin-top:1.5rem;">
          <div class="data-table-header"><div class="data-table-title">🛒 구매 내역</div></div>
          <table class="data-table">
            <thead><tr><th>날짜</th><th>상품명</th><th>가격</th><th>상태</th></tr></thead>
            <tbody>` + orders.map(o => `<tr>
              <td>${formatKSTShort(o.requested_at || o.created_at)}</td>
              <td>${o.product_name}</td>
              <td>${o.price} 달란트</td>
              <td><span style="padding:0.15rem 0.5rem;border-radius:4px;font-size:0.8rem;background:${statusColor[o.status]||'#868e96'}22;color:${statusColor[o.status]||'#868e96'};font-weight:600;">${statusMap[o.status]||o.status}</span></td>
            </tr>`).join('') + '</tbody></table></div>';
      }

      main.innerHTML = html;
    }
  </script>
  <script src="js/version.js?v=3.10.0"></script>
</body>
</html>
